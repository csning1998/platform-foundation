---
base_baremetal_redis_base:
  apt_repositories:
    - id: "redis"
      url_base: "https://packages.redis.io/deb"
      gpg_url: "https://packages.redis.io/gpg"
      gpg_keyring_path: "/etc/apt/keyrings/redis.gpg"
      distribution: "{{ ansible_distribution_release }}"
      components: "main"
      filename: "redis"

  packages:
    apt:
      - redis-server
      - redis-sentinel
      - prometheus-redis-exporter

  services_to_disable:
    - redis-server
    - redis-sentinel
    - prometheus-redis-exporter

  os_config:
    fstab_path: "/etc/fstab"

# Redis apt Repo
_base_baremetal_redis_repo_data: >-
  {{ base_baremetal_redis_base.apt_repositories
  | selectattr('id', 'equalto', 'redis') | first }}
_base_baremetal_redis_repo_string: >
  deb [signed-by={{ _base_baremetal_redis_repo_data.gpg_keyring_path }}]
  {{ _base_baremetal_redis_repo_data.url_base }}
  {{ _base_baremetal_redis_repo_data.distribution }}
  {{ _base_baremetal_redis_repo_data.components }}
