---
# Unseals one server. vault status exits 2 while the server is sealed.
- name: "Read the seal status of {{ _provision_vault_downstream_pod }}"
  ansible.builtin.command:
    argv: >-
      {{
        _provision_vault_downstream_kubectl +
        [
          'exec', _provision_vault_downstream_pod, '-c', provision_vault_downstream_container, '--',
          'vault', 'status', '-format=json'
        ]
      }}
  register: _provision_vault_downstream_status
  changed_when: false
  failed_when: _provision_vault_downstream_status.rc not in [0, 2]

- name: "Unseal {{ _provision_vault_downstream_pod }}"
  when: _provision_vault_downstream_status.rc == 2
  ansible.builtin.command:
    argv: >-
      {{
        _provision_vault_downstream_kubectl +
        [
          'exec', _provision_vault_downstream_pod, '-c', provision_vault_downstream_container, '--',
          'vault', 'operator', 'unseal', item
        ]
      }}
  loop: "{{ _provision_vault_downstream_unseal_keys }}"
  register: _provision_vault_downstream_unseal
  until: _provision_vault_downstream_unseal.rc == 0
  retries: "{{ provision_vault_downstream_unseal_retries }}"
  delay: "{{ provision_vault_downstream_unseal_delay_seconds }}"
  changed_when: true
  no_log: true
