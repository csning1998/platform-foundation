---
base_docker_base:
  packages:
    pip:
      - docker
    apt:
      - containerd.io
      - docker-ce
      - docker-ce-cli
      - docker-buildx-plugin
      - docker-compose-plugin

  group_name: "docker"

  os_config:
    ubuntu:
      source_url: "https://download.docker.com/linux/ubuntu"
      gpg_keyring_dir: "/etc/apt/keyrings"
      gpg_filename: "docker.asc"

_base_docker_gpg_url: "{{ base_docker_base.os_config.ubuntu.source_url }}/gpg"
_base_docker_gpg_path: >-
  {{ base_docker_base.os_config.ubuntu.gpg_keyring_dir }}/{{ base_docker_base.os_config.ubuntu.gpg_filename }}
_base_docker_repo_string: >
  deb [arch=amd64 signed-by={{ _base_docker_gpg_path }}]
  {{ base_docker_base.os_config.ubuntu.source_url }}
  {{ ansible_facts['distribution_release'] | lower }} stable
