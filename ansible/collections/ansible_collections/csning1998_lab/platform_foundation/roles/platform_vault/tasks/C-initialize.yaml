---
- name: "Block C1: Initialize Vault Cluster (Primary Only)"
  become: true
  run_once: true
  block:
    - name: "C1a. Wait for Vault"
      ansible.builtin.wait_for:
        port: "{{ platform_vault_port_api }}"
        delay: "{{ platform_vault_vault_wait_delay_seconds }}"

    - name: "C1b. Initialize Vault"
      ansible.builtin.command: >
        vault operator init \
        -key-shares={{ platform_vault_vault_init_key_shares }} \
        -key-threshold={{ platform_vault_vault_init_key_threshold }} \
        -format=json
      environment: "{{ platform_vault_local_cli_environment }}"
      register: platform_vault_init_result
      changed_when: platform_vault_init_result.rc == 0
      failed_when:
        - platform_vault_init_result.rc != 0
        - "'Vault is already initialized' not in platform_vault_init_result.stderr"

    - name: "C1c. Take the Vault Proxy route of identity {{ project_code }}"
      ansible.builtin.include_role:
        name: csning1998_lab.platform_foundation.utils_vault_operator_login
      vars:
        utils_vault_operator_login_use_ambient: true
      when: platform_vault_init_result.rc == 0

    # Encodes unseal keys as JSON string to satisfy provider schema constraints requiring scalar string values.
    - name: "C1d. Persist the root token and unseal keys to the Bastion Vault"
      ansible.builtin.uri:
        url: "{{ operator_vault_url }}/v1/secret/data/{{ platform_vault_init_kv_path }}"
        method: POST
        headers:
          X-Vault-Token: "{{ utils_vault_operator_login_token }}"
        ca_path: "{{ operator_vault_ca_cert_path }}"
        client_cert: "{{ operator_vault_client_cert | default(omit, true) }}"
        client_key: "{{ operator_vault_client_key | default(omit, true) }}"
        validate_certs: true
        body_format: json
        body:
          data:
            prod_vault_root_token: "{{ (platform_vault_init_result.stdout | from_json).root_token }}"
            prod_vault_unseal_keys: "{{ (platform_vault_init_result.stdout | from_json).unseal_keys_b64 | to_json }}"
        status_code: [200, 204]
      delegate_to: localhost
      become: false
      no_log: true
      when: platform_vault_init_result.rc == 0

  rescue:
    # Writes ephemeral init credentials to disk on persistence failure to prevent permanent data loss.
    - name: "C1-rescue1. Preserve Vault init secrets if initialization succeeded but persistence failed"
      ansible.builtin.copy:
        content: "{{ platform_vault_init_result.stdout }}"
        dest: "{{ platform_vault_emergency_init_path }}"
        mode: "0600"
      when: platform_vault_init_result is defined and platform_vault_init_result.rc == 0
      no_log: true
      delegate_to: localhost
      become: false

    - name: "Block C1: Initialize Vault Cluster (Primary Only) failed"
      vars:
        _c1_emergency_note: >-
          Vault was newly initialized during this execution but the root token and unseal keys
          could not be persisted to the Bastion Vault, and they have been saved to
          {{ platform_vault_emergency_init_path }} on the Ansible control
          machine (mode 0600). Retrieve them manually, complete the write to the
          Bastion Vault through the {{ project_code }} Vault Proxy, then delete that file.
      ansible.builtin.fail:
        msg: >-
          {{ ansible_failed_result.msg | default('see task output above') }}
          {{ _c1_emergency_note if (platform_vault_init_result is defined and platform_vault_init_result.rc == 0) else '' }}
