---
# The raft data outlives the OS disk on the data disk which the catalog declares, mounted at the raft path.
# A held filesystem stays, hence an OS disk rebuild keeps the raft data.
- name: "Block A3: Mount the Raft Data Disk"
  become: true
  when: platform_vault_data_device | length > 0
  block:
    - name: "A3a. Check current mount state"
      ansible.builtin.command:
        cmd: "findmnt --source {{ platform_vault_data_device }} --mountpoint {{ platform_vault_dir_data }}"
      register: _platform_vault_disk_mounted
      changed_when: false
      failed_when: false

    - name: "A3b. Initialize and mount the data disk"
      when: _platform_vault_disk_mounted.rc != 0
      block:
        - name: "A3b-i. Check whether the data disk holds a filesystem"
          ansible.builtin.command:
            cmd: "blkid {{ platform_vault_data_device }}"
          register: _platform_vault_disk_blkid
          changed_when: false
          failed_when: false

        # blkid exits 2 for a device without any recognized filesystem, the only state which permits formatting.
        - name: "A3b-ii. Format the data disk with XFS"
          ansible.builtin.command:
            cmd: "mkfs.xfs {{ platform_vault_data_device }}"
          when: _platform_vault_disk_blkid.rc == 2
          changed_when: true

        - name: "A3b-iii. Read the UUID of the data disk"
          ansible.builtin.command:
            cmd: "blkid -s UUID -o value {{ platform_vault_data_device }}"
          register: _platform_vault_disk_uuid
          changed_when: false

        - name: "A3b-iv. Mount the data disk at the raft path and persist the mount in fstab"
          ansible.posix.mount:
            path: "{{ platform_vault_dir_data }}"
            src: "UUID={{ _platform_vault_disk_uuid.stdout }}"
            fstype: xfs
            opts: defaults
            state: mounted

    - name: "A3c. Enforce ownership on the raft path"
      ansible.builtin.file:
        path: "{{ platform_vault_dir_data }}"
        state: directory
        owner: "{{ utils_common_defaults_vault_owner }}"
        group: "{{ utils_common_defaults_vault_group }}"
        mode: "0750"

  rescue:
    - name: "Block A3: Mount the Raft Data Disk failed"
      ansible.builtin.fail:
        msg: "{{ ansible_failed_result.msg | default('see task output above') }}"
