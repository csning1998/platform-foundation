---
- name: "Block D1: Unseal Primary Node"
  become: true
  when: inventory_hostname in groups['primary']
  block:
    - name: "D1a. Check Current Vault Status"
      ansible.builtin.command: vault status -format=json
      environment: "{{ platform_vault_local_cli_environment }}"
      register: platform_vault_vault_status_check
      changed_when: false
      failed_when: false

    - name: "D1b. Take the Vault Proxy route of identity {{ project_code }}"
      ansible.builtin.include_role:
        name: csning1998_lab.platform_foundation.utils_vault_operator_login
      vars:
        utils_vault_operator_login_use_ambient: true
      when:
        - platform_vault_vault_status_check.rc == 2
        - platform_vault_vault_status_check.stdout | length > 0
        - (platform_vault_vault_status_check.stdout | from_json).sealed

    - name: "D1c. Fetch Unseal Keys from the Bastion Vault"
      ansible.builtin.uri:
        url: "{{ operator_vault_url }}/v1/secret/data/{{ platform_vault_init_kv_path }}"
        method: GET
        headers:
          X-Vault-Token: "{{ utils_vault_operator_login_token }}"
        ca_path: "{{ operator_vault_ca_cert_path }}"
        client_cert: "{{ operator_vault_client_cert | default(omit, true) }}"
        client_key: "{{ operator_vault_client_key | default(omit, true) }}"
        validate_certs: true
        return_content: true
      register: platform_vault_unseal_secrets
      delegate_to: localhost
      become: false
      when:
        - platform_vault_vault_status_check.rc == 2
        - platform_vault_vault_status_check.stdout | length > 0
        - (platform_vault_vault_status_check.stdout | from_json).sealed
      no_log: true

    - name: "D1e. Parse Unseal Keys"
      ansible.builtin.set_fact:
        platform_vault_vault_unseal_keys: >-
          {{ platform_vault_unseal_secrets.json.data.data.prod_vault_unseal_keys | from_json }}
      when: platform_vault_unseal_secrets is not skipped
      no_log: true

    - name: "D1f. Execute Unseal"
      ansible.builtin.command: "vault operator unseal {{ item }}"
      environment: "{{ platform_vault_local_cli_environment }}"
      loop: "{{ platform_vault_vault_unseal_keys[: platform_vault_vault_init_key_threshold | int] }}"
      register: platform_vault_unseal_result
      changed_when: "'Sealed: false' in platform_vault_unseal_result.stdout"
      when: platform_vault_vault_unseal_keys is defined
      no_log: true

  rescue:
    - name: "Block D1: Unseal Primary Node failed"
      ansible.builtin.fail:
        msg: "{{ ansible_failed_result.msg | default('see task output above') }}"

- name: "Block D2: Raft Join and Unseal Replica Nodes"
  become: true
  when: inventory_hostname in groups['replica']
  block:
    - name: "D2a. Wait for Vault to become Initialized (Raft Join)"
      ansible.builtin.command: vault status -format=json
      environment: "{{ platform_vault_local_cli_environment }}"
      register: platform_vault_vault_init_check
      until:
        - platform_vault_vault_init_check.rc in [0, 2]
        - platform_vault_vault_init_check.stdout | length > 0
        - (platform_vault_vault_init_check.stdout | from_json).initialized
      retries: "{{ platform_vault_vault_unseal_retries }}"
      delay: "{{ platform_vault_vault_unseal_delay_seconds }}"
      changed_when: false
      failed_when: platform_vault_vault_init_check.rc not in [0, 2]

    - name: "D2b. Take the Vault Proxy route of identity {{ project_code }}"
      ansible.builtin.include_role:
        name: csning1998_lab.platform_foundation.utils_vault_operator_login
      vars:
        utils_vault_operator_login_use_ambient: true
      when:
        - platform_vault_vault_init_check.rc == 2
        - platform_vault_vault_init_check.stdout | length > 0
        - (platform_vault_vault_init_check.stdout | from_json).sealed

    - name: "D2c. Fetch Unseal Keys from the Bastion Vault"
      ansible.builtin.uri:
        url: "{{ operator_vault_url }}/v1/secret/data/{{ platform_vault_init_kv_path }}"
        method: GET
        headers:
          X-Vault-Token: "{{ utils_vault_operator_login_token }}"
        ca_path: "{{ operator_vault_ca_cert_path }}"
        client_cert: "{{ operator_vault_client_cert | default(omit, true) }}"
        client_key: "{{ operator_vault_client_key | default(omit, true) }}"
        validate_certs: true
        return_content: true
      register: platform_vault_unseal_secrets
      delegate_to: localhost
      become: false
      when:
        - platform_vault_vault_init_check.rc == 2
        - platform_vault_vault_init_check.stdout | length > 0
        - (platform_vault_vault_init_check.stdout | from_json).sealed
      no_log: true

    - name: "D2e. Parse Unseal Keys"
      ansible.builtin.set_fact:
        platform_vault_vault_unseal_keys: >-
          {{ platform_vault_unseal_secrets.json.data.data.prod_vault_unseal_keys | from_json }}
      when: platform_vault_unseal_secrets is not skipped
      no_log: true

    - name: "D2f. Execute Unseal"
      ansible.builtin.command: "vault operator unseal {{ item }}"
      environment: "{{ platform_vault_local_cli_environment }}"
      loop: "{{ platform_vault_vault_unseal_keys[: platform_vault_vault_init_key_threshold | int] }}"
      register: platform_vault_unseal_result
      changed_when: "'Sealed: false' in platform_vault_unseal_result.stdout"
      when: platform_vault_vault_unseal_keys is defined
      no_log: true

  rescue:
    - name: "Block D2: Raft Join and Unseal Replica Nodes failed"
      ansible.builtin.fail:
        msg: "{{ ansible_failed_result.msg | default('see task output above') }}"

- name: "Block D3: Verify Vault Cluster Availability"
  become: true
  when:
    - inventory_hostname in groups['primary']
    - vault_vip is defined
    - platform_vault_ca_chain_b64 is defined
  block:
    - name: "D3a0. Create temporary CA file for health check"
      ansible.builtin.tempfile:
        state: file
        suffix: .crt
      register: platform_vault_vault_health_ca_file
      delegate_to: localhost
      become: false

    - name: "D3a1. Write Vault CA to temp file"
      ansible.builtin.copy:
        content: "{{ platform_vault_ca_chain_b64 | b64decode }}"
        dest: "{{ platform_vault_vault_health_ca_file.path }}"
        mode: "0600"
      delegate_to: localhost
      become: false

    - name: "D3a. Wait for Vault VIP to be Active (200 OK)"
      ansible.builtin.uri:
        url: "https://{{ vault_vip }}:443/v1/sys/health"
        validate_certs: true
        ca_path: "{{ platform_vault_vault_health_ca_file.path }}"
        status_code: 200
      register: platform_vault_health_check
      until: platform_vault_health_check.status == 200
      retries: 60
      delay: 2
      delegate_to: localhost
      become: false

  rescue:
    - name: "Block D3: Verify Vault Cluster Availability failed"
      ansible.builtin.fail:
        msg: "{{ ansible_failed_result.msg | default('see task output above') }}"

  always:
    - name: "D3b. Clean up temporary Vault CA file"
      ansible.builtin.file:
        path: "{{ platform_vault_vault_health_ca_file.path }}"
        state: absent
      when:
        - inventory_hostname in groups['primary']
        - platform_vault_vault_health_ca_file is defined
        - platform_vault_vault_health_ca_file.path is defined
      delegate_to: localhost
      become: false
