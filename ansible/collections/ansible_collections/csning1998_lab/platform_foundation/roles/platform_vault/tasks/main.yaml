---
- name: "Section A. Setup Vault Environment"
  ansible.builtin.include_tasks: A-setup.yaml

# The service unit starts in Section B, hence the raft path mounts before the first start.
- name: "Section A. Mount the Raft Data Disk"
  ansible.builtin.include_tasks: A0-data-disk.yaml

- name: "Section B. Configure Vault Instance"
  ansible.builtin.include_tasks: B-configure.yaml

- name: "Section C. Initialize Vault Cluster"
  ansible.builtin.include_tasks: C-initialize.yaml
  when: inventory_hostname in groups['primary']

# Target for platform CLI post-reboot unseal or tagged playbook execution.
- name: "Section D. Unseal Vault Cluster"
  ansible.builtin.include_tasks:
    file: D-unseal.yaml
    apply:
      tags: [vault-unseal]
  tags: [vault-unseal]
