---
- name: "Block A: Install Dependencies"
  become: true
  block:
    - name: "Step A1. Update apt cache"
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: "Step A2. Ensure unzip is installed"
      ansible.builtin.apt:
        name: unzip
        state: present

  rescue:
    - name: "Block A: Install Dependencies failed"
      ansible.builtin.fail:
        msg: "{{ ansible_failed_result.msg | default('see task output above') }}"

- name: "Block B: Install Vault Binary"
  become: true
  block:
    - name: "Step B0. Check installed Vault version"
      ansible.builtin.command: vault version
      register: base_baremetal_vault_installed_version
      changed_when: false
      failed_when: false

    - name: "Step B1. Download and Unarchive Vault (v{{ base_baremetal_vault_target_version }})"
      vars:
        base_baremetal_vault_zip: >-
          {{ 'vault_' ~ base_baremetal_vault_target_version ~ '_' ~ base_baremetal_vault_target_os
             ~ '_' ~ base_baremetal_vault_target_arch ~ '.zip' }}
      ansible.builtin.unarchive:
        src: "https://releases.hashicorp.com/vault/{{ base_baremetal_vault_target_version }}/{{ base_baremetal_vault_zip }}"
        dest: "/usr/local/bin"
        remote_src: true
        mode: "0755"
        owner: root
        group: root
      when: >-
        base_baremetal_vault_installed_version.rc != 0 or
        base_baremetal_vault_target_version not in
        (base_baremetal_vault_installed_version.stdout | default('')).split() | map('replace', 'v', '')

    - name: "Step B2. Verify Vault installation"
      ansible.builtin.command: vault --version
      register: base_baremetal_vault_version_output
      changed_when: false

    - name: "Step B3. Print Vault version"
      ansible.builtin.debug:
        msg: "Vault installed: {{ base_baremetal_vault_version_output.stdout }}"

    - name: "Step B4. Create Vault system group"
      ansible.builtin.group:
        name: "{{ utils_common_defaults_vault_group | default('vault') }}"
        system: true
        state: present

    - name: "Step B5. Create Vault system user"
      ansible.builtin.user:
        name: "{{ utils_common_defaults_vault_owner | default('vault') }}"
        group: "{{ utils_common_defaults_vault_group | default('vault') }}"
        system: true
        shell: /usr/sbin/nologin
        create_home: false
        home: /etc/vault.d

  rescue:
    - name: "Block B: Install Vault Binary failed"
      ansible.builtin.fail:
        msg: "{{ ansible_failed_result.msg | default('see task output above') }}"

- name: "Block C: Disable Swap"
  become: true
  block:
    - name: "Step C1. Check if swap is active"
      ansible.builtin.command: swapon --show
      register: base_baremetal_vault_swapon_check
      changed_when: false
      failed_when: false

    - name: "Step C2. Disable swap if it is active"
      ansible.builtin.command: swapoff -a
      when: base_baremetal_vault_swapon_check.stdout != ""
      changed_when: true

    - name: "Step C3. Comment out swap entries in /etc/fstab"
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#].*?\sswap\s+.*)$'
        replace: '# \1'

  rescue:
    - name: "Block C: Disable Swap failed"
      ansible.builtin.fail:
        msg: "{{ ansible_failed_result.msg | default('see task output above') }}"
