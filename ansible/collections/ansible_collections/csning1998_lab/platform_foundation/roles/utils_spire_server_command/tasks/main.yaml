---
# Runs one spire-server command on the selected SPIRE server.
# The outcome stays in the fact utils_spire_server_command_result.
- name: "Step 0. Assert the selected kind is supported"
  ansible.builtin.assert:
    that:
      - utils_spire_server_command_kind in ['parent', 'child']
      - utils_spire_server_command_arguments | length > 0
    fail_msg: >-
      utils_spire_server_command_kind MUST be parent or child,
      and utils_spire_server_command_arguments MUST NOT be empty.

- name: "Block A: Run the command on the SPIRE Parent host"
  when: utils_spire_server_command_kind == 'parent'
  block:
    - name: "Step A1. Execute spire-server on the Parent host"
      ansible.builtin.command:
        cmd: >-
          spire-server {{ utils_spire_server_command_arguments }}
          -socketPath {{ utils_spire_server_command_parent_socket_path }}
      register: _utils_spire_server_command_parent
      changed_when: false
      failed_when: false
      ignore_unreachable: true
      # Ansible expands delegate_to before the condition of the block.
      # The value MUST therefore stay non empty for kind child.
      delegate_to: >-
        {{ utils_spire_server_command_parent_ssh_host if utils_spire_server_command_kind == 'parent' else 'localhost' }}
      become: true
      no_log: "{{ utils_spire_server_command_no_log }}"

    - name: "Step A2. Keep the outcome of the Parent command"
      ansible.builtin.set_fact:
        utils_spire_server_command_result:
          rc: "{{ _utils_spire_server_command_parent.rc | default(255) }}"
          stdout: "{{ _utils_spire_server_command_parent.stdout | default('') }}"
          stderr: >-
            {{
              _utils_spire_server_command_parent.stderr
              | default(_utils_spire_server_command_parent.msg | default(''))
            }}
          unreachable: "{{ _utils_spire_server_command_parent.unreachable | default(false) }}"
      no_log: "{{ utils_spire_server_command_no_log }}"

- name: "Block B: Run the command in the pod of the Child server"
  when: utils_spire_server_command_kind == 'child'
  block:
    - name: "Step B0. Assert the caller supplied the Child coordinates"
      ansible.builtin.assert:
        that:
          - utils_spire_server_command_child_kubeconfig_kv_path | length > 0
          - utils_spire_server_command_terraform_operator_jwt_command | length > 0
          - utils_spire_server_command_terraform_operator_vault_role | length > 0
          - utils_spire_server_command_terraform_operator_vault_auth_mount | length > 0
          - utils_spire_server_command_operator_vault_endpoint | length > 0
          - utils_spire_server_command_operator_vault_ca_cert_path | length > 0
        fail_msg: >-
          Kind child MUST receive the KV path of the Child kubeconfig, the JWT command, the Vault role and the auth mount
          of the Terraform operator, and the endpoint and CA path of the operator Vault.

    - name: "Step B1. Read the kubeconfig of the Child cluster from the operator Vault KV"
      ansible.builtin.include_role:
        name: csning1998_lab.platform_foundation.utils_vault_kv2_read
      vars:
        utils_vault_kv2_read_access:
          endpoint: "{{ utils_spire_server_command_operator_vault_endpoint }}"
          ca_cert_path: "{{ utils_spire_server_command_operator_vault_ca_cert_path }}"
          auth_mount: "{{ utils_spire_server_command_terraform_operator_vault_auth_mount }}"
          role: "{{ utils_spire_server_command_terraform_operator_vault_role }}"
          wrapper: "{{ utils_spire_server_command_terraform_operator_jwt_command }}"
        utils_vault_kv2_read_secrets:
          - path: "{{ utils_spire_server_command_child_kubeconfig_kv_path }}"
            as: child_kubeconfig
            fields: [content_b64]

    - name: "Step B2. Keep the kubeconfig of the Child cluster"
      ansible.builtin.set_fact:
        _utils_spire_server_command_kubeconfig_content_b64: "{{ utils_vault_kv2_read_result.child_kubeconfig.content_b64 }}"
      no_log: true

    - name: "Step B3. Write the kubeconfig to a private temporary file"
      ansible.builtin.tempfile:
        state: file
        prefix: spire-child-kubeconfig.
      register: _utils_spire_server_command_kubeconfig_file
      delegate_to: localhost
      become: false

    - name: "Step B4. Restrict and fill the temporary kubeconfig"
      ansible.builtin.copy:
        content: "{{ _utils_spire_server_command_kubeconfig_content_b64 | b64decode }}"
        dest: "{{ _utils_spire_server_command_kubeconfig_file.path }}"
        mode: "0600"
      delegate_to: localhost
      become: false
      no_log: true

    - name: "Step B5. Execute spire-server in the pod of the Child server"
      ansible.builtin.command:
        argv: >-
          {{
            [
              'kubectl', '--kubeconfig', _utils_spire_server_command_kubeconfig_file.path, '--request-timeout=60s',
              '-n', utils_spire_server_command_child_namespace, 'exec', utils_spire_server_command_child_pod,
              '-c', utils_spire_server_command_child_container, '--',
              utils_spire_server_command_child_binary
            ]
            + (utils_spire_server_command_arguments | trim | regex_replace('\\s+', ' ') | split(' '))
            + ['-socketPath', utils_spire_server_command_child_socket_path]
          }}
      register: _utils_spire_server_command_child
      changed_when: false
      failed_when: false
      delegate_to: localhost
      become: false
      no_log: "{{ utils_spire_server_command_no_log }}"

    - name: "Step B6. Keep the outcome of the Child command"
      ansible.builtin.set_fact:
        utils_spire_server_command_result:
          rc: "{{ _utils_spire_server_command_child.rc | default(255) }}"
          stdout: "{{ _utils_spire_server_command_child.stdout | default('') }}"
          stderr: "{{ _utils_spire_server_command_child.stderr | default('') }}"
          unreachable: false
      no_log: "{{ utils_spire_server_command_no_log }}"

  always:
    - name: "Step B7. Remove the temporary kubeconfig"
      ansible.builtin.file:
        path: "{{ _utils_spire_server_command_kubeconfig_file.path }}"
        state: absent
      when: _utils_spire_server_command_kubeconfig_file.path is defined
      delegate_to: localhost
      become: false

- name: "Step C. Fail the play on a command failure unless the caller tolerates it"
  ansible.builtin.fail:
    msg: >-
      spire-server {{ utils_spire_server_command_arguments.split(' ')[0] }}
      on the {{ utils_spire_server_command_kind }} server
      exited {{ utils_spire_server_command_result.rc }}:
      {{ utils_spire_server_command_result.stderr | default('') | truncate(400) }}
  when:
    - not utils_spire_server_command_tolerate_failure
    - utils_spire_server_command_result.rc | int != 0
