---
- name: "Block: Install etcd Binaries"
  become: true
  block:
    - name: "Step 1. Download etcd package ({{ base_baremetal_etcd_base.version }})"
      ansible.builtin.get_url:
        url: "{{ _base_baremetal_etcd_download_url }}"
        dest: "{{ _base_baremetal_etcd_temp_path }}"
        mode: "0644"

    - name: "Step 2. Extract etcd package"
      ansible.builtin.unarchive:
        src: "{{ _base_baremetal_etcd_temp_path }}"
        dest: /tmp
        remote_src: true

    - name: "Step 3. Copy etcd binaries to install directory"
      ansible.builtin.copy:
        src: "{{ _base_baremetal_etcd_temp_extract_path }}/{{ item }}"
        dest: "{{ base_baremetal_etcd_base.binary.install_path }}/{{ item }}"
        remote_src: true
        mode: "0755"
      loop: "{{ base_baremetal_etcd_base.binary.files }}"

    - name: "Step 4. Clean up temporary etcd files"
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ _base_baremetal_etcd_temp_path }}"
        - "{{ _base_baremetal_etcd_temp_extract_path }}"

  rescue:
    - name: "Block: Install etcd Binaries failed"
      ansible.builtin.fail:
        msg: "{{ ansible_failed_result.msg | default('see task output above') }}"
