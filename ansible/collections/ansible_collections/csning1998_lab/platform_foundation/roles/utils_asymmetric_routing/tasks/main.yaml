---
# Routes traffic to infrastructure VIPs through the host-only load balancer VIP to prevent
# NAT gateway stateful firewall drops on asymmetric return traffic. The egress interface is
# resolved dynamically based on subnet membership, ensuring robustness across interface naming,
# CNI/Docker configurations, and different cluster runtimes (Kubeadm, MicroK8s, Baremetal).

- name: "Step 1. Store the next-hop gateway address"
  ansible.builtin.set_fact:
    utils_asymmetric_routing_next_hop_via: "{{ routing_static_routes[0].via }}"

- name: "Step 2. Collect interfaces directly connected to the next-hop subnet"
  ansible.builtin.set_fact:
    utils_asymmetric_routing_egress_ifaces: "{{ utils_asymmetric_routing_egress_ifaces | default([]) + [item] }}"
  loop: "{{ ansible_facts.interfaces }}"
  vars:
    _ipv4: "{{ ansible_facts[item].ipv4 | default({'prefix': '32', 'network': '0.0.0.0'}) }}"
    _divisor: "{{ (2 ** (32 - (_ipv4.prefix | int))) | int }}"
    _gw_int: >-
      {{  (utils_asymmetric_routing_next_hop_via.split('.')[0] | int) * 2**24
        + (utils_asymmetric_routing_next_hop_via.split('.')[1] | int) * 2**16
        + (utils_asymmetric_routing_next_hop_via.split('.')[2] | int) * 2**8
        + (utils_asymmetric_routing_next_hop_via.split('.')[3] | int)
      }}
    _net_int: >-
      {{  (_ipv4.network.split('.')[0] | int) * 2**24
        + (_ipv4.network.split('.')[1] | int) * 2**16
        + (_ipv4.network.split('.')[2] | int) * 2**8
        + (_ipv4.network.split('.')[3] | int)
      }}
  when:
    - ansible_facts[item] is defined
    - ansible_facts[item].ipv4 is defined
    - (_gw_int | int) // (_divisor | int) == (_net_int | int) // (_divisor | int)

- name: "Step 3. Validate exactly one egress interface matches the next-hop subnet"
  ansible.builtin.assert:
    that:
      - utils_asymmetric_routing_egress_ifaces | default([]) | length == 1
    fail_msg: |
      Expected exactly 1 interface on the next-hop subnet of {{ utils_asymmetric_routing_next_hop_via }},
      but found {{ utils_asymmetric_routing_egress_ifaces | default([]) | length }}.
      Candidates: {{ utils_asymmetric_routing_egress_ifaces | default([]) }}
    success_msg: "Identified host-only egress interface: {{ utils_asymmetric_routing_egress_ifaces[0] }}"

- name: "Step 4. Finalize host-only interface variable"
  ansible.builtin.set_fact:
    utils_asymmetric_routing_hostonly_iface: "{{ utils_asymmetric_routing_egress_ifaces[0] }}"

- name: "Step 5. Deploy Routing Fix Service"
  ansible.builtin.template:
    src: fix-routes.service.j2
    dest: /etc/systemd/system/fix-vault-routes.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart Asymmetric Route Service

- name: "Step 6. Immediate Route Enforcement"
  ansible.builtin.command:
    cmd: >-
      /usr/sbin/ip route replace {{ item.to }}
      via {{ item.via }}
      dev {{ utils_asymmetric_routing_hostonly_iface }}
      metric {{ item.metric | default(100) }}
      advmss {{ global_mss }}
  loop: "{{ routing_static_routes }}"
  changed_when: false
