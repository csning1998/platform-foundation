---
- name: "Block A: Install Postgres Server via Official Apt Repository"
  become: true
  block:
    - name: "Step 1. Ensure Postgres common GPG key directory exists"
      ansible.builtin.file:
        path: "{{ _base_baremetal_postgres_repo_data.gpg_store_path | dirname }}"
        state: directory
        mode: "0755"

    - name: "Step 2. Import the Postgres repository signing key"
      ansible.builtin.get_url:
        url: "{{ _base_baremetal_postgres_repo_data.gpg_url }}"
        dest: "{{ _base_baremetal_postgres_repo_data.gpg_store_path }}"
        mode: "0644"
      register: base_baremetal_postgres_gpg_key_result
      until: base_baremetal_postgres_gpg_key_result is succeeded
      retries: 5
      delay: 2

    - name: "Step 3. Create the Postgres repository configuration file"
      ansible.builtin.apt_repository:
        repo: "{{ _base_baremetal_postgres_repo_string }}"
        state: present
        filename: "{{ _base_baremetal_postgres_repo_data.filename }}"

    - name: "Step 4. Install Postgres packages (v{{ base_baremetal_postgres_base.versions.postgres }})"
      ansible.builtin.apt:
        name: "{{ _base_baremetal_postgres_versioned_packages }}"
        state: present
        update_cache: true

    - name: "Step 5. Install Postgres metrics exporter"
      ansible.builtin.apt:
        name: "{{ base_baremetal_postgres_base.packages.apt.exporters }}"
        state: present

    - name: "Step 6. Disable exporter service (no database available at image build time)"
      ansible.builtin.systemd:
        name: prometheus-postgres-exporter
        state: stopped
        enabled: false
      failed_when: false

  rescue:
    - name: "Block A: Install Postgres Server via Official Apt Repository failed"
      ansible.builtin.fail:
        msg: "{{ ansible_failed_result.msg | default('see task output above') }}"
