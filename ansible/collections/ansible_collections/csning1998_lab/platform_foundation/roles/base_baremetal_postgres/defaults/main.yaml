---
base_baremetal_postgres_base:
  versions:
    postgres: "18"

  apt_repositories:
    - id: "postgresql"
      url_base: "https://apt.postgresql.org/pub/repos/apt"
      gpg_url: "https://www.postgresql.org/media/keys/ACCC4CF8.asc"
      gpg_store_path: "/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc"
      gpg_signed_by_path: "/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc"
      distribution: "{{ ansible_distribution_release }}-pgdg"
      components: "main"
      filename: "pgdg"

  packages:
    apt:
      postgres:
        - postgresql
        - postgresql-contrib
      patroni_deps:
        - python3-venv
        - libpq-dev
      exporters:
        - prometheus-postgres-exporter

# Apt Repo (Postgres)
_base_baremetal_postgres_repo_data: >-
  {{ base_baremetal_postgres_base.apt_repositories
  | selectattr('id', 'equalto', 'postgresql') | first }}
_base_baremetal_postgres_repo_string: >
  deb [signed-by={{ _base_baremetal_postgres_repo_data.gpg_signed_by_path }}]
  {{ _base_baremetal_postgres_repo_data.url_base }}
  {{ _base_baremetal_postgres_repo_data.distribution }}
  {{ _base_baremetal_postgres_repo_data.components }}

# Apt Packages (Postgres)
_base_baremetal_postgres_versioned_packages: >-
  {{ base_baremetal_postgres_base.packages.apt.postgres
  | map('regex_replace', '^(.*)$', '\1-' + base_baremetal_postgres_base.versions.postgres)
  | list }}
