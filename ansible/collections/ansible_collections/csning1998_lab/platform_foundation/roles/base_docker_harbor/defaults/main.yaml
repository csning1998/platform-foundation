---
base_docker_harbor_preload:
  # Latest Harbor version number can be fetched via
  # 'echo $(curl -s https://api.github.com/repos/goharbor/harbor/releases/latest | jq -r .tag_name)'
  version: "2.14.2"
  dest_dir: "/opt/harbor-install"
  installer_filename: "harbor-offline-installer.tgz"

# SHA-256 digest reported by the GitHub Releases API for the corresponding version's
# harbor-offline-installer-vX.Y.Z.tgz asset (api.github.com/repos/goharbor/harbor/releases/tags/vX.Y.Z).
base_docker_harbor_sha256: "fd69d363946809ff7821f4fdbaca323e1c55c0649ffa82f8acc6085ff0eb262d"

_base_docker_harbor_download_url_template: >-
  {{ [
    'https://github.com/goharbor/harbor/releases/download/v',
    base_docker_harbor_preload.version,
    '/harbor-offline-installer-v',
    base_docker_harbor_preload.version,
    '.tgz'
  ] | join('') }}
