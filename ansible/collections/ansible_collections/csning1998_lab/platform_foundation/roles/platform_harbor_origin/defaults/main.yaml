---
# Harbor Installation Paths
platform_harbor_origin_harbor_install_dir: "/opt/harbor-install"
platform_harbor_origin_harbor_data_dir: "/data/harbor"

# Harbor Container User IDs (Harbor 2.x uses 10000)
platform_harbor_origin_harbor_uid: 10000
platform_harbor_origin_harbor_gid: 10000

# PKI Paths (Host Side)
# Bastion-issued leaf material is written here. Harbor mounts these files.
platform_harbor_origin_harbor_pki_dir: "{{ platform_harbor_origin_harbor_data_dir }}/pki"
platform_harbor_origin_harbor_cert_path: "{{ platform_harbor_origin_harbor_pki_dir }}/server.crt"
platform_harbor_origin_harbor_key_path: "{{ platform_harbor_origin_harbor_pki_dir }}/server.key"
platform_harbor_origin_harbor_ca_path: "{{ platform_harbor_origin_harbor_pki_dir }}/ca.crt"

# Internal Harbor Config PKI Paths (for Nginx)
platform_harbor_origin_harbor_config_cert_dir: "{{ platform_harbor_origin_harbor_data_dir }}/secret/cert"

platform_harbor_origin_external_hostname: "{{ harbor_origin_fqdn }}"

# Helm Installation
platform_harbor_origin_helm_version: "v3.14.3"
platform_harbor_origin_helm_install_script_url: >-
  https://raw.githubusercontent.com/helm/helm/{{ platform_harbor_origin_helm_version }}/scripts/get-helm-3
platform_harbor_origin_helm_install_script_checksum: >-
  sha256:6701e269a95eec0a5f67067f504f43ad94e9b4a52ec1205d26b3973d6f5cb3dc

# Harbor Installer Configuration
# Example: "--with-trivy --with-chartmuseum"
platform_harbor_origin_harbor_installer_flags: "--with-trivy"
