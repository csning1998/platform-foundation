---
- name: "C1. Render harbor.yml"
  ansible.builtin.template:
    src: harbor.yml.j2
    dest: "{{ platform_harbor_origin_harbor_install_dir }}/harbor.yml"
    owner: root
    group: root
    mode: "0600"
  register: platform_harbor_origin_harbor_system_config_status

- name: "C2. Run Install Script (First Time Only)"
  ansible.builtin.command:
    cmd: "./install.sh {{ platform_harbor_origin_harbor_installer_flags }}"
    chdir: "{{ platform_harbor_origin_harbor_install_dir }}"
  args:
    creates: "{{ platform_harbor_origin_harbor_install_dir }}/docker-compose.yml"
  register: platform_harbor_origin_install

- name: "C3. Distribute the Vault PKI trust bundle to Harbor's own trust store"
  when: vault_ca_cert_b64 is defined
  block:
    - name: "C3a. Ensure Harbor trust-certificates directory exists"
      ansible.builtin.file:
        path: "{{ platform_harbor_origin_harbor_install_dir }}/common/config/shared/trust-certificates"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: "C3b. Write the Vault PKI trust bundle into Harbor trust store"
      ansible.builtin.copy:
        content: "{{ vault_ca_cert_b64 | b64decode }}"
        dest: >-
          {{ platform_harbor_origin_harbor_install_dir }}/common/config/shared/trust-certificates/vault-intermediate-pki.crt
        owner: root
        group: root
        mode: "0644"
      notify: Restart Harbor Service

- name: "C4. Find docker executable"
  ansible.builtin.command: which docker
  register: platform_harbor_origin_docker_exec
  changed_when: false
  check_mode: false

- name: "C5. Deploy Harbor Systemd Service"
  ansible.builtin.template:
    src: harbor.service.j2
    dest: /etc/systemd/system/harbor.service
    owner: root
    group: root
    mode: "0644"
  vars:
    docker_executable: "{{ platform_harbor_origin_docker_exec.stdout }}"
  notify: Restart Harbor Service

# install.sh already ran prepare. A second prepare restarts core while
# golang-migrate is still running and leaves schema_migrations dirty.
- name: "C6. Reconfigure Harbor (If Config Changed)"
  ansible.builtin.command:
    cmd: "./prepare {{ platform_harbor_origin_harbor_installer_flags }}"
    chdir: "{{ platform_harbor_origin_harbor_install_dir }}"
  when:
    - platform_harbor_origin_harbor_system_config_status.changed
    - not (platform_harbor_origin_install.changed | default(false))
    - not (ansible_check_mode | bool)
  changed_when: true
  notify: Restart Harbor Service

- name: "C7. Enable and Start Harbor Service"
  ansible.builtin.systemd:
    name: harbor
    state: started
    enabled: true
    daemon_reload: true

- name: "C8. Wait for harbor-core health after start or prepare"
  ansible.builtin.command:
    cmd: docker inspect --format {% raw %}{{.State.Health.Status}}{% endraw %} harbor-core
  register: platform_harbor_origin_core_health
  until: platform_harbor_origin_core_health.stdout == "healthy"
  retries: 30
  delay: 10
  changed_when: false
  failed_when: platform_harbor_origin_core_health.stdout != "healthy"
