---
- name: "Assert Harbor Origin required variables"
  tags: always
  ansible.builtin.assert:
    that:
      - harbor_origin_credential_kv_path is defined
      - harbor_origin_fqdn is defined
      - harbor_origin_listen_address is defined
    fail_msg: >-
      harbor_origin_credential_kv_path, harbor_origin_fqdn, and harbor_origin_listen_address
      must all be supplied by the caller.

# Read Harbor passwords from Downstream Vault. Using import_role ensures credentials are read even during tag-limited runs.
- name: "Section 0. Read the Harbor passwords from the Downstream Vault"
  tags: always
  ansible.builtin.import_role:
    name: csning1998_lab.platform_foundation.utils_vault_kv2_read
  vars:
    utils_vault_kv2_read_target: downstream
    utils_vault_kv2_read_secrets:
      - path: "{{ harbor_origin_credential_kv_path }}"
        as: harbor_origin
        fields: [harbor_origin_admin_password, harbor_origin_pg_db_password]

- name: "Section 0. Expose the Harbor passwords to the role"
  tags: always
  ansible.builtin.set_fact:
    platform_harbor_origin_admin_password: "{{ utils_vault_kv2_read_result.harbor_origin.harbor_origin_admin_password }}"
    platform_harbor_origin_pg_db_password: "{{ utils_vault_kv2_read_result.harbor_origin.harbor_origin_pg_db_password }}"
  no_log: true

- name: "Section A. Setup Harbor Environment"
  ansible.builtin.include_tasks: A-setup.yaml

- name: "Section B. Configure PKI"
  ansible.builtin.include_tasks: B-configure.yaml

# Documentation: documentation/architecture/platform-spire-parent-frontend.md Section 9.
- name: "Role 83: Provision SPIRE Agent for Workload Identity"
  ansible.builtin.include_role:
    name: csning1998_lab.platform_foundation.utils_spire_agent
  vars:
    utils_spire_agent_server_kind: child
    utils_spire_agent_server_address: "{{ spire_child_agent_address }}"
    utils_spire_agent_server_port: "{{ spire_child_agent_port }}"
    utils_spire_agent_child_kubeconfig_kv_path: "{{ spire_child_kubeconfig_kv_path }}"
  when:
    - spire_child_agent_address is defined
    - spire_trust_domain is defined
    - spire_cluster_name is defined

- name: "Role 84: Register SPIRE Workload Entry"
  ansible.builtin.include_role:
    name: csning1998_lab.platform_foundation.utils_spire_workload_entry
  vars:
    utils_spire_workload_entry_spiffe_id: "{{ spire_workload_spiffe_id }}"
    utils_spire_workload_entry_selector: "docker:label:spiffe-workload:{{ spire_cluster_name }}"
    utils_spire_workload_entry_server_kind: child
    utils_spire_workload_entry_child_kubeconfig_kv_path: "{{ spire_child_kubeconfig_kv_path }}"
  when:
    - spire_workload_spiffe_id is defined
    - spire_child_agent_address is defined

- name: "Role 82: Prepare Environment for Vault Agent"
  ansible.builtin.include_role:
    name: csning1998_lab.platform_foundation.utils_vault_agent
  vars:
    utils_vault_agent_owner: "{{ _platform_harbor_origin_harbor_uid }}"
    utils_vault_agent_group: "{{ _platform_harbor_origin_harbor_gid }}"
    utils_vault_agent_cert_base_dir: "{{ platform_harbor_origin_harbor_pki_dir }}"
    utils_vault_agent_cert_mode: "0700"
    utils_vault_agent_cert_dirs:
      - "{{ platform_harbor_origin_harbor_pki_dir }}"
      - "{{ platform_harbor_origin_harbor_config_cert_dir }}"
    utils_vault_agent_wait_file: "{{ platform_harbor_origin_harbor_cert_path }}"
    utils_vault_agent_ip_sans: "{{ advertise_ip }},{{ harbor_origin_vip }}"
    utils_vault_agent_auth_path: "{{ vault_auth_path }}"
    utils_vault_agent_auth_role_name: "{{ vault_agent_auth_role_name }}"
    utils_vault_agent_jwt_audience: "{{ vault_agent_jwt_audience }}"
    utils_vault_agent_pki_role_name: "{{ vault_role_name }}"
    utils_vault_agent_pki_mount_path: "{{ vault_pki_mount_path }}"
    utils_vault_agent_common_name: "{{ vault_agent_common_name }}"
    utils_vault_agent_vault_listener_ca_cert_b64: "{{ vault_ca_cert_b64 }}"
    utils_vault_agent_post_command: |
      install -m 0644 -o {{ _platform_harbor_origin_harbor_uid }} -g {{ _platform_harbor_origin_harbor_gid }} \
        {{ platform_harbor_origin_harbor_cert_path }} {{ platform_harbor_origin_harbor_config_cert_dir }}/server.crt
      install -m 0600 -o {{ _platform_harbor_origin_harbor_uid }} -g {{ _platform_harbor_origin_harbor_gid }} \
        {{ platform_harbor_origin_harbor_key_path }} {{ platform_harbor_origin_harbor_config_cert_dir }}/server.key
      docker ps -q -f name=^nginx$ | grep -q . && docker exec -i nginx nginx -s reload || true
  when:
    - vault_auth_path is defined
    - vault_agent_auth_role_name is defined

- name: "Section C. Deploy Harbor Instance"
  ansible.builtin.include_tasks: C-deploy.yaml

- name: "Section D. Verify Harbor Readiness"
  ansible.builtin.include_tasks: D-verify.yaml
