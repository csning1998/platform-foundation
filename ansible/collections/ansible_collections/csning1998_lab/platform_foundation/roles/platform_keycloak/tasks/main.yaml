---
# Read Keycloak credentials from Downstream Vault to keep secrets out of Terraform state.
- name: "Section 0. Read the Keycloak credentials from the Downstream Vault"
  ansible.builtin.include_role:
    name: csning1998_lab.platform_foundation.utils_vault_kv2_read
  vars:
    utils_vault_kv2_read_target: downstream
    utils_vault_kv2_read_secrets:
      - path: "{{ keycloak_credential_kv_path }}"
        as: keycloak
        fields: [keycloak_admin_user, keycloak_admin_password, keycloak_db_user, keycloak_db_password]

- name: "Section 0. Expose the Keycloak credentials to the role"
  ansible.builtin.set_fact:
    platform_keycloak_admin_user: "{{ utils_vault_kv2_read_result.keycloak.keycloak_admin_user }}"
    platform_keycloak_admin_password: "{{ utils_vault_kv2_read_result.keycloak.keycloak_admin_password }}"
    platform_keycloak_db_user: "{{ utils_vault_kv2_read_result.keycloak.keycloak_db_user }}"
    platform_keycloak_db_password: "{{ utils_vault_kv2_read_result.keycloak.keycloak_db_password }}"
  no_log: true

- name: "Role 81: Configure Network Routing (Asymmetric Fix)"
  ansible.builtin.include_role:
    name: csning1998_lab.platform_foundation.utils_asymmetric_routing
  vars:
    utils_asymmetric_routing_static_routes: "{{ keycloak_static_routes }}"
  when: keycloak_static_routes is defined

- name: "Section A. Setup Keycloak Environment"
  ansible.builtin.include_tasks: A-setup.yaml

- name: "Section B. Configure Environment and Vault Agent"
  ansible.builtin.include_tasks: B-configure.yaml

- name: "Role 83: Provision SPIRE Agent for Workload Identity"
  ansible.builtin.include_role:
    name: csning1998_lab.platform_foundation.utils_spire_agent
  vars:
    utils_spire_agent_server_kind: child
    utils_spire_agent_server_address: "{{ spire_child_agent_address }}"
    utils_spire_agent_server_port: "{{ spire_child_agent_port }}"
    utils_spire_agent_child_kubeconfig_kv_path: "{{ spire_child_kubeconfig_kv_path }}"

# Ensures local availability of the spiffe-helper container image required for workload SVID retrieval.
- name: "Role 84: Ensure the spiffe-helper Image"
  ansible.builtin.include_role:
    name: csning1998_lab.platform_foundation.base_docker_spiffe_helper

- name: "Role 85: Register SPIRE Workload Entry"
  ansible.builtin.include_role:
    name: csning1998_lab.platform_foundation.utils_spire_workload_entry
  vars:
    utils_spire_workload_entry_spiffe_id: "{{ spire_workload_spiffe_id }}"
    utils_spire_workload_entry_selector: "docker:label:spiffe-workload:{{ spire_cluster_name }}"
    utils_spire_workload_entry_server_kind: child
    utils_spire_workload_entry_child_kubeconfig_kv_path: "{{ spire_child_kubeconfig_kv_path }}"

- name: "Role 82: Prepare Environment for Vault Agent (OIDC/Certificates)"
  ansible.builtin.include_role:
    name: csning1998_lab.platform_foundation.utils_vault_agent
  vars:
    utils_vault_agent_ip_sans: "{{ advertise_ip }}"
    utils_vault_agent_owner: "1000"
    utils_vault_agent_group: "1000"
    utils_vault_agent_cert_dirs:
      - "/opt/keycloak/certs"
    utils_vault_agent_cert_base_dir: "/opt/keycloak/certs"
    utils_vault_agent_cert_mode: "0750"
    utils_vault_agent_post_command: "systemctl restart keycloak || true"
    utils_vault_agent_auth_path: "{{ vault_auth_path }}"
    utils_vault_agent_jwt_audience: "{{ vault_agent_jwt_audience }}"
    utils_vault_agent_auth_role_name: "{{ vault_agent_auth_role_name }}"
    utils_vault_agent_pki_role_name: "{{ vault_role_name }}"
    utils_vault_agent_pki_mount_path: "{{ vault_pki_mount_path }}"
    utils_vault_agent_vault_listener_ca_cert_b64: "{{ vault_ca_cert_b64 }}"
    utils_vault_agent_common_name: "{{ vault_agent_common_name }}"

- name: "Section C. Deploy Keycloak Stack"
  ansible.builtin.include_tasks: C-deploy.yaml

- name: "Section D. Verify Keycloak Readiness"
  ansible.builtin.include_tasks: D-verify.yaml
