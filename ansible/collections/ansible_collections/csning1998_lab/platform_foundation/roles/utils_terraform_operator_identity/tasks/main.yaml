---
- name: "Block A: Install jq for JWT-SVID JSON Parsing"
  become: true
  block:
    - name: "Step A1. Ensure jq is installed"
      ansible.builtin.package:
        name: jq
        state: present

  rescue:
    - name: "Block A: Install jq failed"
      ansible.builtin.fail:
        msg: "{{ ansible_failed_result.msg | default('see task output above') }}"

- name: "Block B: Assert Required Variables"
  ansible.builtin.assert:
    that:
      - utils_terraform_operator_identity_operator_user | length > 0
      - utils_terraform_operator_identity_operator_user is match('^[a-zA-Z0-9_-]+$')
      - utils_terraform_operator_identity_name is match('^[a-zA-Z0-9_-]+$')
      - utils_terraform_operator_identity_spiffe_path is defined
      - utils_terraform_operator_identity_spiffe_path is match('^(/[a-zA-Z0-9_-]+)+$')
    fail_msg: >-
      utils_terraform_operator_identity_operator_user (from the $USER environment variable) and
      utils_terraform_operator_identity_name must both be non-empty and contain only alphanumerics,
      underscores, or hyphens. Both values are rendered verbatim into a sudoers policy file;
      any other character risks injecting an unintended sudoers directive.
      utils_terraform_operator_identity_spiffe_path MUST be supplied by the caller as an absolute
      SPIFFE ID path such as /<owner>/terraform-operator/<service>/<component>.

- name: "Block C: Create Dedicated Service User"
  become: true
  block:
    - name: "Step C1. Create the per-consumer unprivileged system user"
      ansible.builtin.user:
        name: "{{ utils_terraform_operator_identity_service_user }}"
        system: true
        shell: /usr/sbin/nologin
        create_home: false
      register: _utils_terraform_operator_identity_service_user

  rescue:
    - name: "Block C: Create Dedicated Service User failed"
      ansible.builtin.fail:
        msg: "{{ ansible_failed_result.msg | default('see task output above') }}"

- name: "Block D: Deploy Sudoers Drop-in"
  become: true
  block:
    - name: "Step D1. Render the sudoers drop-in"
      ansible.builtin.template:
        src: sudoers.j2
        dest: >-
          /etc/sudoers.d/terraform-operator-identity-{{
            utils_terraform_operator_identity_wrapper_name | regex_replace('^spire-fetch-', '') }}
        owner: root
        group: root
        mode: "0440"
        validate: "visudo -cf %s"

  rescue:
    - name: "Block D: Deploy Sudoers Drop-in failed"
      ansible.builtin.fail:
        msg: "{{ ansible_failed_result.msg | default('see task output above') }}"

- name: "Block E: Deploy JWT-SVID Fetch Wrapper"
  become: true
  block:
    - name: "Step E1. Render the JWT-SVID fetch wrapper"
      ansible.builtin.template:
        src: spire-fetch-jwt.sh.j2
        dest: "{{ utils_terraform_operator_identity_wrapper_dir }}/{{ utils_terraform_operator_identity_wrapper_name }}"
        owner: root
        group: root
        mode: "0755"

  rescue:
    - name: "Block E: Deploy JWT-SVID Fetch Wrapper failed"
      ansible.builtin.fail:
        msg: "{{ ansible_failed_result.msg | default('see task output above') }}"

# Documentation: documentation/architecture/platform-spire-parent-frontend.md Section 8.
- name: "Block F: Register Workload Entry"
  block:
    - name: "Step F0. Assert the service user's uid was captured"
      ansible.builtin.assert:
        that:
          - _utils_terraform_operator_identity_service_user.uid is defined
        fail_msg: >-
          _utils_terraform_operator_identity_service_user.uid is undefined. user-creation task in
          Block C must run (not skipped by --tags or check mode) before this workload entry can bind
          to a real uid selector.

    - name: "Step F1. Register this service user's SPIFFE workload entry"
      ansible.builtin.include_role:
        name: csning1998_lab.platform_foundation.utils_spire_workload_entry
      vars:
        utils_spire_workload_entry_spiffe_id: "{{ 'spiffe://' ~ spire_trust_domain
          ~ utils_terraform_operator_identity_spiffe_path }}"
        utils_spire_workload_entry_selector: >-
          unix:uid:{{ _utils_terraform_operator_identity_service_user.uid }}
        utils_spire_workload_entry_server_kind: "{{ utils_terraform_operator_identity_spire_server_kind }}"
        utils_spire_workload_entry_child_kubeconfig_kv_path: >-
          {{ utils_terraform_operator_identity_child_kubeconfig_kv_path }}
        # platform terraform fetches one JWT per terraform run. The SPIRE Server default of
        # 5 minutes expires mid-run on a slow layer such as platform-cilium-hubble.
        utils_spire_workload_entry_jwt_svid_ttl: "1800"

  rescue:
    - name: "Block F: Register Workload Entry failed"
      ansible.builtin.fail:
        msg: "{{ ansible_failed_result.msg | default('see task output above') }}"
