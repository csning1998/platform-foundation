---
# Containerd sandbox (pause) image. Override via inventory to use Harbor proxy
# in air-gap environments, e.g. 172.16.143.250/k8s-proxy/pause:3.10.1
base_kubernetes_kubeadm_containerd_pause_image: "registry.k8s.io/pause:3.10.1"

base_kubernetes_kubeadm_base:
  versions:
    repo_major: "v1.32"
    binary_full: "v1.32.0"
    package_spec: "1.32.0-1.1"

  binaries:
    - name: "crictl"
      url_base: "https://github.com/kubernetes-sigs/cri-tools/releases/download"
      dest_path: "/usr/local/bin"

  apt_repositories:
    - id: "ubuntu_community"
      url_base: "http://archive.ubuntu.com/ubuntu"
      filename: "ubuntu-with-community"
      distribution: "{{ ansible_distribution_release }}"
      components: "main restricted universe multiverse"
      gpg_keyring_path: null

    - id: "docker"
      url_base: "https://download.docker.com/linux/ubuntu"
      filename: "docker"
      distribution: "{{ ansible_distribution_release }}"
      components: "stable"
      version_key: ""
      gpg_keyring_path: "/etc/apt/keyrings/docker.gpg"
      gpg_key_temp_path: "/tmp/docker.gpg"

    - id: "kubernetes"
      url_base: "https://pkgs.k8s.io/core:/stable:"
      filename: "kubernetes"
      distribution: "/"
      components: ""
      version_key: "repo_major"
      gpg_keyring_path: "/etc/apt/keyrings/kubernetes-apt-keyring.gpg"
      gpg_key_temp_path: "/tmp/kubernetes-apt-keyring.asc"

  packages:
    apt:
      prereq:
        - "dkms"
        - "linux-headers-{{ ansible_kernel }}"
        - "perl"
        - "libelf-dev"
      cri:
        - "containerd.io"
      kubernetes:
        - "kubelet"
        - "kubeadm"
        - "kubectl"

  config_paths:
    modules: "/etc/modules-load.d/k8s.conf"
    sysctl: "/etc/sysctl.d/k8s.conf"
    containerd: "/etc/containerd/config.toml"

# Binaries (crictl)
_base_kubernetes_kubeadm_crictl_data: >-
  {{ base_kubernetes_kubeadm_base.binaries
  | selectattr('name', 'equalto', 'crictl') | first }}
_base_kubernetes_kubeadm_crictl_archive_name: >-
  {{ 'crictl-' ~ base_kubernetes_kubeadm_base.versions.binary_full
  ~ '-linux-amd64.tar.gz' }}
_base_kubernetes_kubeadm_crictl_release_url: >-
  {{ _base_kubernetes_kubeadm_crictl_data.url_base }}/{{ base_kubernetes_kubeadm_base.versions.binary_full }}
_base_kubernetes_kubeadm_crictl_download_url: >-
  {{ _base_kubernetes_kubeadm_crictl_release_url }}/{{ _base_kubernetes_kubeadm_crictl_archive_name }}
_base_kubernetes_kubeadm_crictl_temp_path: "/tmp/{{ _base_kubernetes_kubeadm_crictl_archive_name }}"
# Apt Repos (Data Lookups)
_base_kubernetes_kubeadm_repo_community_data: >-
  {{ base_kubernetes_kubeadm_base.apt_repositories | selectattr('id', 'equalto', 'ubuntu_community') | first }}
_base_kubernetes_kubeadm_repo_docker_data: >-
  {{ base_kubernetes_kubeadm_base.apt_repositories | selectattr('id', 'equalto', 'docker') | first }}
_base_kubernetes_kubeadm_repo_k8s_data: >-
  {{ base_kubernetes_kubeadm_base.apt_repositories | selectattr('id', 'equalto', 'kubernetes') | first }}

# Apt Repos (Computed Strings)
_base_kubernetes_kubeadm_repo_community_string: >
  deb [arch=amd64]
  {{ _base_kubernetes_kubeadm_repo_community_data.url_base }}
  {{ _base_kubernetes_kubeadm_repo_community_data.distribution }}
  {{ _base_kubernetes_kubeadm_repo_community_data.components }}

_base_kubernetes_kubeadm_repo_docker_gpg_url: "https://download.docker.com/linux/ubuntu/gpg"
_base_kubernetes_kubeadm_repo_docker_string: >
  deb [arch=amd64 signed-by={{ _base_kubernetes_kubeadm_repo_docker_data.gpg_keyring_path }}]
  {{ _base_kubernetes_kubeadm_repo_docker_data.url_base }}
  {{ _base_kubernetes_kubeadm_repo_docker_data.distribution }}
  {{ _base_kubernetes_kubeadm_repo_docker_data.components }}

_base_kubernetes_kubeadm_repo_k8s_version: >-
  {{ base_kubernetes_kubeadm_base.versions[_base_kubernetes_kubeadm_repo_k8s_data.version_key] }}
_base_kubernetes_kubeadm_repo_k8s_url_full: >-
  {{ _base_kubernetes_kubeadm_repo_k8s_data.url_base
  ~ '/' ~ _base_kubernetes_kubeadm_repo_k8s_version ~ '/deb/' }}
_base_kubernetes_kubeadm_repo_k8s_gpg_url: "{{ _base_kubernetes_kubeadm_repo_k8s_url_full }}Release.key"
_base_kubernetes_kubeadm_repo_k8s_string: >
  deb [signed-by={{ _base_kubernetes_kubeadm_repo_k8s_data.gpg_keyring_path }}]
  {{ _base_kubernetes_kubeadm_repo_k8s_url_full }}
  {{ _base_kubernetes_kubeadm_repo_k8s_data.distribution }}
  {{ _base_kubernetes_kubeadm_repo_k8s_data.components }}

_base_kubernetes_kubeadm_k8s_versioned_packages: >-
  {{
    base_kubernetes_kubeadm_base.packages.apt.kubernetes |
    map('regex_replace', '^(.*)$', '\1=' + base_kubernetes_kubeadm_base.versions.package_spec) |
    list
  }}
