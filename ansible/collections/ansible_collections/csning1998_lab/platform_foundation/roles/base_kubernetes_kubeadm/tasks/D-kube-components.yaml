---
- name: Block D. Install Kubernetes components
  block:
    - name: "Step 1. Download Kubernetes GPG key"
      ansible.builtin.get_url:
        url: "{{ _base_kubernetes_kubeadm_repo_k8s_gpg_url }}"
        dest: "{{ _base_kubernetes_kubeadm_repo_k8s_data.gpg_key_temp_path }}"
        mode: "0644"

    - name: "Step 2. Dearmor Kubernetes GPG key"
      ansible.builtin.command:
        cmd: >-
          gpg --dearmor -o {{ _base_kubernetes_kubeadm_repo_k8s_data.gpg_keyring_path }}
          {{ _base_kubernetes_kubeadm_repo_k8s_data.gpg_key_temp_path }}
      args:
        creates: "{{ _base_kubernetes_kubeadm_repo_k8s_data.gpg_keyring_path }}"
      register: base_kubernetes_kubeadm_gpg_dearmor_k8s_result
      changed_when: >-
        base_kubernetes_kubeadm_gpg_dearmor_k8s_result.rc == 0 and
        'overwrite' not in base_kubernetes_kubeadm_gpg_dearmor_k8s_result.stderr

    - name: "Step 3. Add Kubernetes apt repository"
      ansible.builtin.apt_repository:
        repo: "{{ _base_kubernetes_kubeadm_repo_k8s_string }}"
        state: present
        filename: "{{ _base_kubernetes_kubeadm_repo_k8s_data.filename }}"
        update_cache: true

    - name: "Step 4. Install kubeadm, kubelet, kubectl"
      ansible.builtin.apt:
        name: "{{ _base_kubernetes_kubeadm_k8s_versioned_packages }}"
        state: present

    - name: "Step 5. Hold Kubernetes package versions"
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop: "{{ base_kubernetes_kubeadm_base.packages.apt.kubernetes }}"

    - name: "Step 6. Enable the kubelet service"
      ansible.builtin.systemd:
        name: kubelet
        enabled: true

    - name: "Step 7. Clean up temporary files"
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ _base_kubernetes_kubeadm_repo_docker_data.gpg_key_temp_path }}"
        - "{{ _base_kubernetes_kubeadm_repo_k8s_data.gpg_key_temp_path }}"

    - name: "Step 8. Ensure Python Kubernetes library for Ansible is installed"
      ansible.builtin.pip:
        name: kubernetes
        state: present
        extra_args: "--break-system-packages --ignore-installed"

  rescue:
    - name: "Block D. Install Kubernetes components failed"
      ansible.builtin.fail:
        msg: "{{ ansible_failed_result.msg | default('see task output above') }}"
