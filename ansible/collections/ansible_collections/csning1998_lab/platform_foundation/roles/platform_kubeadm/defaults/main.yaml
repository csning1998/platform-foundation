---
# 34-kubeadm-prerequisites Defaults
# platform_kubeadm_registry_host is injected from inventory template
platform_kubeadm_registry_host: ""

# 35-kubeadm-ha-haproxy Defaults
# HAProxy Tuning
platform_kubeadm_haproxy_maxconn: 4096
platform_kubeadm_haproxy_timeout_connect: 5000
platform_kubeadm_haproxy_timeout_client: 50000
platform_kubeadm_haproxy_timeout_server: 50000

# Keepalived Tuning
platform_kubeadm_keepalived_router_id: "k8s_master"
platform_kubeadm_keepalived_vrrp_id: 51
platform_kubeadm_keepalived_advert_int: 1

# Kubernetes Version & CRI
platform_kubeadm_version: "v1.32.0"
platform_kubeadm_cri_socket: "unix:///var/run/containerd/containerd.sock"
platform_kubeadm_cgroup_driver: "systemd"
platform_kubeadm_k8s_cgroup_driver: "systemd"

# Networking Defaults
platform_kubeadm_pod_subnet: "{{ platform_kubeadm_pod_subnet | default('10.244.0.0/16') }}"
platform_kubeadm_ha_vip: "{{ platform_kubeadm_ha_vip | default('') }}"
platform_kubeadm_master_ips: "{{ platform_kubeadm_master_ips | default([]) }}"

# API Server Cert SANs
platform_kubeadm_extra_sans:
  - "kubernetes"
  - "kubernetes.default"
  - "kubernetes.default.svc"
  - "kubernetes.default.svc.cluster.local"

# Local path to save the fetched kubeconfig
platform_kubeadm_fetched_kubeconfig_path: >-
  {{ inventory_dir }}/fetched/{{ service_identifier | default('default') }}/kubeconfig

# Join Configuration
platform_kubeadm_k8s_join_skip_ca_verification: false
platform_kubeadm_k8s_join_ignore_preflight_errors:
  - "Port-6443"
