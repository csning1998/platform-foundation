---
# 1. Configures libvirtd socket delegation and group access privileges.
- name: "Include: libvirtd socket delegation"
  ansible.builtin.include_tasks: libvirtd-socket.yaml

# 2. Configures kernel sysctl parameters for host routing, L2 bypass, and connection tracking.
- name: "Include: kernel sysctl tuning"
  ansible.builtin.include_tasks: kernel-sysctl.yaml

# 3. Configures firewalld direct rules for TCP MSS clamping.
- name: "Include: TCPMSS clamp firewalld rules"
  ansible.builtin.include_tasks: mss-clamp.yaml

# 4. Deploys node_exporter for hypervisor host OS performance metrics collection.
- name: "Include: host OS node_exporter"
  ansible.builtin.include_tasks: node-exporter.yaml

# 5. Deploys prometheus-libvirt-exporter via upstream RPM for guest VM resource monitoring.
- name: "Include: libvirt domain exporter"
  ansible.builtin.include_tasks: libvirt-exporter.yaml

# 6. Applies SELinux policy granting virtproxyd access to libvirt-exporter proc entries to resolve AVC denials.
- name: "Include: virtproxyd SELinux policy module"
  ansible.builtin.include_tasks: selinux-virtproxyd.yaml

# 7. Enables inter-segment forwarding across routed libvirt networks.
- name: "Include: libvirt-routed zone forwarding"
  ansible.builtin.include_tasks: libvirt-routed-forward.yaml

# Compilation of the CGo-based Libvirt client in tools/entry MUST utilize header files
# which the libvirt-devel package provides.
- name: "Include: libvirt development headers"
  ansible.builtin.include_tasks: libvirt-dev-headers.yaml
