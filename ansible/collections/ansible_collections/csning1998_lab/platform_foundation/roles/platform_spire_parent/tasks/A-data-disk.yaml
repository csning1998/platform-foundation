---
- name: "A1. Check current mount state"
  ansible.builtin.command:
    cmd: findmnt --source /dev/vdb --mountpoint {{ utils_common_defaults_spire_dir_data }}
  register: _platform_spire_parent_disk_already_mounted
  changed_when: false
  failed_when: false

- name: "A2. Initialize vdb"
  when: _platform_spire_parent_disk_already_mounted.rc != 0
  block:
    - name: "A2a. Check if vdb is already formatted"
      ansible.builtin.command:
        cmd: blkid /dev/vdb
      register: _platform_spire_parent_disk_blkid
      changed_when: false
      failed_when: false

    - name: "A2b. Format vdb with XFS"
      ansible.builtin.command:
        cmd: mkfs.xfs /dev/vdb
      when: _platform_spire_parent_disk_blkid.rc != 0
      changed_when: true

    - name: "A2c. Get vdb UUID"
      ansible.builtin.command:
        cmd: blkid -s UUID -o value /dev/vdb
      register: _platform_spire_parent_disk_uuid
      changed_when: false

    - name: "A2d. Ensure SPIRE data base directory exists"
      ansible.builtin.file:
        path: "{{ utils_common_defaults_spire_dir_data }}"
        state: directory
        owner: "{{ utils_common_defaults_spire_owner }}"
        group: "{{ utils_common_defaults_spire_group }}"
        mode: "0700"

    - name: "A2e. Mount vdb at SPIRE data path and persist in fstab"
      ansible.posix.mount:
        path: "{{ utils_common_defaults_spire_dir_data }}"
        src: "UUID={{ _platform_spire_parent_disk_uuid.stdout }}"
        fstype: xfs
        opts: defaults
        state: mounted

  rescue:
    - name: "A2. Initialize vdb failed"
      ansible.builtin.fail:
        msg: "{{ ansible_failed_result.msg | default('see task output above') }}"

- name: "A3. Enforce ownership on vdb mount root"
  ansible.builtin.file:
    path: "{{ utils_common_defaults_spire_dir_data }}"
    owner: "{{ utils_common_defaults_spire_owner }}"
    group: "{{ utils_common_defaults_spire_group }}"
    mode: "0700"

# A routine OS disk rebuild MUST preserve persistent SPIRE CA keys on the persistent data volume
# while intentional greenfield re-initialization purges datastore state.
- name: "A4. Reinitialize the SPIRE trust domain for a deliberate greenfield reset"
  when: spire_parent_trust_domain_reinitialization | default(false) | bool
  block:
    - name: "A4a. Check whether the SPIRE Server unit is installed yet"
      ansible.builtin.stat:
        path: /etc/systemd/system/spire-server.service
      register: _platform_spire_parent_service_unit

    - name: "A4b. Stop SPIRE Server before the reinitialization"
      ansible.builtin.systemd:
        name: spire-server
        state: stopped
      when: _platform_spire_parent_service_unit.stat.exists

    - name: "A4c. Remove datastore and CA key material"
      ansible.builtin.file:
        path: "{{ utils_common_defaults_spire_dir_data }}/{{ item }}"
        state: absent
      loop:
        - datastore.sqlite3
        - datastore.sqlite3-shm
        - datastore.sqlite3-wal
        - keys.json
        - private

    - name: "A4d. Restart SPIRE Server after the reinitialization"
      ansible.builtin.systemd:
        name: spire-server
        state: started
      when: _platform_spire_parent_service_unit.stat.exists

  rescue:
    - name: "A4. Reinitialize the SPIRE trust domain failed"
      ansible.builtin.fail:
        msg: "Greenfield reinitialization failed: {{ ansible_failed_result | default('see task output above') }}"
