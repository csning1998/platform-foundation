---
- name: "Block B1: System & Service Configuration"
  become: true
  block:
    - name: "B1a. Create SPIRE Config Directory"
      ansible.builtin.file:
        path: "{{ utils_common_defaults_spire_dir_config }}"
        state: directory
        owner: "{{ utils_common_defaults_spire_owner }}"
        group: "{{ utils_common_defaults_spire_group }}"
        mode: "0750"

    - name: "B1a2. Deploy Bastion Vault Listener CA Certificate"
      ansible.builtin.copy:
        content: "{{ spire_vault_upstream_ca_cert_b64 | b64decode }}"
        dest: "{{ platform_spire_parent_upstream_ca_cert_path }}"
        owner: "{{ utils_common_defaults_spire_owner }}"
        group: "{{ utils_common_defaults_spire_group }}"
        mode: "0640"
      notify: Restart SPIRE Server Service

    # Pre-creates the directory consumed by downstream child registration tasks for k8s_psat kubeconfig delivery.
    - name: "B1a3. Create the k8s_psat kubeconfig directory"
      ansible.builtin.file:
        path: "{{ platform_spire_parent_k8s_psat_dir }}"
        state: directory
        owner: "{{ utils_common_defaults_spire_owner }}"
        group: "{{ utils_common_defaults_spire_group }}"
        mode: "0750"

    - name: "B1b. Deploy SPIRE Server Config"
      ansible.builtin.template:
        src: server.conf.j2
        dest: "{{ utils_common_defaults_spire_dir_config }}/server.conf"
        owner: "{{ utils_common_defaults_spire_owner }}"
        group: "{{ utils_common_defaults_spire_group }}"
        mode: "0640"
      notify: Restart SPIRE Server Service

    - name: "B1c. Create SPIRE Server Systemd Service"
      ansible.builtin.template:
        src: spire-server.service.j2
        dest: "/etc/systemd/system/spire-server.service"
        owner: root
        group: root
        mode: "0644"
      notify: Restart SPIRE Server Service

  rescue:
    - name: "Block B1: System & Service Configuration failed"
      ansible.builtin.fail:
        msg: "{{ ansible_failed_result.msg | default('see task output above') }}"

# The workstation issues the secret ID through the Vault Proxy, and the secret ID never enters a Terraform state.
# A held secret ID stays while the operator Vault still knows the secret ID under the current role.
- name: "Block B2: Upstream Authority Secret ID"
  become: true
  block:
    - name: "B2a. Take the Vault Proxy route of identity {{ project_code }}"
      ansible.builtin.include_role:
        name: csning1998_lab.platform_foundation.utils_vault_operator_login
      vars:
        utils_vault_operator_login_use_ambient: true

    - name: "B2b. Read the secret ID which the host holds"
      ansible.builtin.slurp:
        src: "{{ platform_spire_parent_upstream_env_path }}"
      register: _platform_spire_parent_upstream_env
      failed_when: false
      no_log: true

    - name: "B2c. Look up the held secret ID on the operator Vault"
      when: _platform_spire_parent_upstream_env.content is defined
      ansible.builtin.uri:
        url: >-
          {{
            operator_vault_url ~ '/v1/auth/' ~ spire_vault_upstream_approle_mount_path ~ '/role/'
            ~ spire_vault_upstream_role_name ~ '/secret-id/lookup'
          }}
        method: POST
        headers:
          X-Vault-Token: "{{ utils_vault_operator_login_token }}"
        body_format: json
        body:
          secret_id: >-
            {{
              _platform_spire_parent_upstream_env.content | b64decode
              | regex_replace('^VAULT_APPROLE_SECRET_ID=', '') | trim
            }}
        ca_path: "{{ operator_vault_ca_cert_path }}"
        client_cert: "{{ operator_vault_client_cert | default(omit, true) }}"
        client_key: "{{ operator_vault_client_key | default(omit, true) }}"
        validate_certs: true
        # Vault answers 204 for a secret ID which the role does not know, and 400 for an orphaned or empty secret ID.
        status_code: [200, 204, 400]
      register: _platform_spire_parent_upstream_lookup
      changed_when: false
      delegate_to: localhost
      become: false
      no_log: true

    - name: "B2d. Issue a secret ID unless the operator Vault knows the secret ID of the host"
      when: (_platform_spire_parent_upstream_lookup.status | default(0)) != 200
      ansible.builtin.uri:
        url: >-
          {{
            operator_vault_url ~ '/v1/auth/' ~ spire_vault_upstream_approle_mount_path ~ '/role/'
            ~ spire_vault_upstream_role_name ~ '/secret-id'
          }}
        method: POST
        headers:
          X-Vault-Token: "{{ utils_vault_operator_login_token }}"
        ca_path: "{{ operator_vault_ca_cert_path }}"
        client_cert: "{{ operator_vault_client_cert | default(omit, true) }}"
        client_key: "{{ operator_vault_client_key | default(omit, true) }}"
        validate_certs: true
        status_code: 200
        return_content: true
      register: _platform_spire_parent_upstream_issue
      delegate_to: localhost
      become: false
      no_log: true

    - name: "B2e. Write the secret ID into the environment file of SPIRE Server"
      when: _platform_spire_parent_upstream_issue.json is defined
      ansible.builtin.copy:
        content: "VAULT_APPROLE_SECRET_ID={{ _platform_spire_parent_upstream_issue.json.data.secret_id }}\n"
        dest: "{{ platform_spire_parent_upstream_env_path }}"
        owner: root
        group: root
        mode: "0600"
      notify: Restart SPIRE Server Service
      no_log: true

  rescue:
    - name: "Block B2: Upstream Authority Secret ID failed"
      ansible.builtin.fail:
        msg: "{{ ansible_failed_result.msg | default('see task output above') }}"

- name: "Block B3: Start SPIRE Server Service"
  become: true
  block:
    - name: "B3a. Enable and start SPIRE Server"
      ansible.builtin.systemd:
        name: spire-server
        enabled: true
        state: started
        daemon_reload: true

    - name: "B3b. Flush handlers before validation"
      ansible.builtin.meta: flush_handlers

  rescue:
    - name: "Block B3: Start SPIRE Server Service failed"
      ansible.builtin.fail:
        msg: "{{ ansible_failed_result.msg | default('see task output above') }}"
