---
- name: Restart SPIRE Server Service
  ansible.builtin.systemd:
    name: spire-server
    state: restarted
    daemon_reload: true

- name: Restart SPIRE OIDC Discovery Provider Service
  ansible.builtin.systemd:
    name: spire-oidc-discovery-provider
    state: restarted
    daemon_reload: true
