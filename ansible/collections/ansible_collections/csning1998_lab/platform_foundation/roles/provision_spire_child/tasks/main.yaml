---
# Registers nested SPIRE Child upstream agent aliases and server entries on the SPIRE Parent host.

- name: "Assert caller supplied required coordinates"
  ansible.builtin.assert:
    that:
      - operator_vault_url | default('') | length > 0
      - operator_vault_ca_cert_path | default('') | length > 0
      - provision_spire_child_cluster_name | default('') | length > 0
      - provision_spire_child_kubeconfig_vault_path | default('') | length > 0
      - provision_spire_child_upstream_agent_alias | default('') | length > 0
      - provision_spire_child_server_spiffe_id | default('') | length > 0
      - provision_spire_child_upstream_agent_namespace | default('') | length > 0
      - provision_spire_child_upstream_agent_sa | default('') | length > 0
      - provision_spire_child_server_namespace | default('') | length > 0
      - provision_spire_child_server_sa | default('') | length > 0
      - provision_spire_child_operator_wrapper | default('') | length > 0
      - provision_spire_child_operator_role | default('') | length > 0
      - provision_spire_child_operator_auth_mount | default('') | length > 0
    fail_msg: >-
      provision-spire-child MUST supply the Downstream Vault coordinates, the Child cluster name,
      and every SPIFFE ID and selector.

- name: "Deliver k8s_psat kubeconfig"
  block:
    - name: "Read kubeconfig of Child cluster from the Downstream Vault"
      ansible.builtin.include_role:
        name: csning1998_lab.platform_foundation.utils_vault_kv2_read
      vars:
        utils_vault_kv2_read_access:
          endpoint: "{{ operator_vault_url }}"
          ca_cert_path: "{{ operator_vault_ca_cert_path }}"
          auth_mount: "{{ provision_spire_child_operator_auth_mount }}"
          role: "{{ provision_spire_child_operator_role }}"
          wrapper: "{{ provision_spire_child_operator_wrapper }}"
        utils_vault_kv2_read_secrets:
          - path: "{{ provision_spire_child_kubeconfig_vault_path }}"
            as: child_kubeconfig
            fields: [kubeconfig_b64]

    - name: "Keep the kubeconfig of the Child cluster"
      ansible.builtin.set_fact:
        _provision_spire_child_kubeconfig_b64: "{{ utils_vault_kv2_read_result.child_kubeconfig.kubeconfig_b64 }}"
      no_log: true

    # Dynamic reload mechanism of k8s_psat applies rotated kubeconfig credentials without service restarts.
    - name: "Write kubeconfig to k8s_psat directory"
      ansible.builtin.copy:
        content: "{{ _provision_spire_child_kubeconfig_b64 | b64decode }}"
        dest: "{{ provision_spire_child_k8s_psat_dir }}/{{ provision_spire_child_cluster_name }}.kubeconfig"
        owner: "{{ utils_common_defaults_spire_owner }}"
        group: "{{ utils_common_defaults_spire_group }}"
        mode: "0600"
      become: true
      no_log: true

  rescue:
    - name: "Deliver k8s_psat kubeconfig failed"
      ansible.builtin.fail:
        msg: "{{ ansible_failed_result.msg | default('see task output above') }}"

- name: "Register node alias and downstream entry"
  become: true
  block:
    # SPIFFE ID registration hierarchy binds node aliases to root server and downstream entries to node aliases.
    - name: "Describe two expected entries"
      ansible.builtin.set_fact:
        _provision_spire_child_entries:
          - name: node-alias
            spiffe_id: "{{ provision_spire_child_upstream_agent_alias }}"
            parent_args: "-node"
            parent_path: "/spire/server"
            downstream: false
            selectors:
              - "k8s_psat:agent_ns:{{ provision_spire_child_upstream_agent_namespace }}"
              - "k8s_psat:agent_sa:{{ provision_spire_child_upstream_agent_sa }}"
              - "k8s_psat:cluster:{{ provision_spire_child_cluster_name }}"
          - name: downstream
            spiffe_id: "{{ provision_spire_child_server_spiffe_id }}"
            parent_args: "-parentID {{ provision_spire_child_upstream_agent_alias }}"
            parent_path: "{{ provision_spire_child_upstream_agent_alias | regex_replace('^spiffe://[^/]+', '') }}"
            downstream: true
            selectors:
              - "k8s:ns:{{ provision_spire_child_server_namespace }}"
              - "k8s:sa:{{ provision_spire_child_server_sa }}"

    - name: "Read existing entries of each SPIFFE ID"
      ansible.builtin.command:
        cmd: >-
          spire-server entry show
          -socketPath {{ provision_spire_child_socket_path }}
          -spiffeID {{ item.spiffe_id }}
          -output json
      register: _provision_spire_child_existing
      changed_when: false
      loop: "{{ _provision_spire_child_entries }}"
      loop_control:
        label: "{{ item.name }}"

    # Preserves identical registrations in-place to avoid unregistration intervals during reconciliation.
    - name: "Classify existing entries as current or stale"
      ansible.builtin.set_fact:
        _provision_spire_child_classified: >-
          {{
            _provision_spire_child_classified | default([]) +
            [{
              'entry': item.item,
              'current_ids': _current_ids | from_json,
              'stale_ids': _all_ids | difference(_current_ids | from_json)
            }]
          }}
      vars:
        _entries: "{{ (item.stdout | from_json).entries | default([], true) }}"
        _all_ids: "{{ _entries | map(attribute='id') | list }}"
        _current_ids: >-
          {%- set ids = [] -%}
          {%- for e in _entries -%}
          {%- set sels = e.selectors | map(attribute='type')
                | zip(e.selectors | map(attribute='value')) | map('join', ':') | sort | list -%}
          {%- if e.parent_id.path == item.item.parent_path
                and (e.downstream | default(false)) == item.item.downstream
                and sels == (item.item.selectors | sort | list) -%}
          {%- set _ = ids.append(e.id) -%}
          {%- endif -%}
          {%- endfor -%}
          {{ ids | to_json }}
      loop: "{{ _provision_spire_child_existing.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: "Delete stale entries"
      ansible.builtin.command:
        cmd: >-
          spire-server entry delete
          -socketPath {{ provision_spire_child_socket_path }}
          -entryID {{ item.1 }}
      changed_when: true
      loop: "{{ _provision_spire_child_classified | subelements('stale_ids') }}"
      loop_control:
        label: "{{ item.0.entry.name }} {{ item.1 }}"

    - name: "Create missing entries"
      ansible.builtin.command:
        cmd: >-
          spire-server entry create
          -socketPath {{ provision_spire_child_socket_path }}
          -spiffeID {{ item.entry.spiffe_id }}
          {{ item.entry.parent_args }}
          {% for s in item.entry.selectors %}-selector {{ s }} {% endfor %}
          {{ '-downstream' if item.entry.downstream else '' }}
      changed_when: true
      when: item.current_ids | length == 0
      loop: "{{ _provision_spire_child_classified }}"
      loop_control:
        label: "{{ item.entry.name }}"

  rescue:
    - name: "Register node alias and downstream entry failed"
      ansible.builtin.fail:
        msg: "{{ ansible_failed_result.msg | default('see task output above') }}"
