---
# Section A: Base Kernel Tuning (from 16-central-lb-base)
platform_haproxy_central_lb_sysctl_hardening:
  - { name: "net.core.somaxconn", value: "4096" }
  - { name: "net.ipv4.tcp_max_syn_backlog", value: "8192" }
  - { name: "net.ipv4.tcp_tw_reuse", value: "1" }
  - { name: "net.ipv4.ip_local_port_range", value: "1024 65535" }
  - { name: "net.ipv4.tcp_slow_start_after_idle", value: "0" }
  - { name: "net.core.rmem_max", value: "16777216" }
  - { name: "net.core.wmem_max", value: "16777216" }
  - { name: "net.ipv4.tcp_rmem", value: "4096 87380 16777216" }
  - { name: "net.ipv4.tcp_wmem", value: "4096 65536 16777216" }
  - { name: "net.ipv4.tcp_mtu_probing", value: "1" }

# Section B: Service Timings
platform_haproxy_haproxy_health_check_inter: "10s"
platform_haproxy_haproxy_health_check_fall: "5"
platform_haproxy_haproxy_health_check_rise: "3"
platform_haproxy_haproxy_ca_path: "/etc/haproxy/certs/ca.crt"

# The stats listener certificate. The PKI role caps the lifetime at 90 days,
# and a run within the last 30 days issues a new one.
platform_haproxy_stats_bundle_path: "/etc/haproxy/certs/vault.pem"
platform_haproxy_stats_cert_ttl: "2160h"
platform_haproxy_stats_renew_before_seconds: 2592000

# The stats listener and its metrics path require this login.
# The play reads the password from the Bastion KV of the tenant, or mints the password on the first run.
platform_haproxy_stats_user: "stats"

# Observability scraper segments which read /metrics of the stats listener without the stats login.
platform_haproxy_metrics_source_cidrs: []
