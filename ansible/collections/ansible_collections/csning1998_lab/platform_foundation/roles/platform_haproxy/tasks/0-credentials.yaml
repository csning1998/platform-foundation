---
# HAProxy precedes the Downstream Vault, hence the credentials live in the Bastion KV of the tenant.
# Every node shares one set, and run_once applies the facts to all hosts of the play.
- name: "Block 0: HAProxy Credentials"
  run_once: true
  block:
    - name: "0a. Take the Vault Proxy route of identity {{ project_code }}"
      ansible.builtin.include_role:
        name: csning1998_lab.platform_foundation.utils_vault_operator_login
      vars:
        utils_vault_operator_login_use_ambient: true

    - name: "0b. Read the held credentials"
      ansible.builtin.uri:
        url: "{{ operator_vault_url ~ '/v1/secret/data/' ~ haproxy_credential_kv_path }}"
        method: GET
        headers:
          X-Vault-Token: "{{ utils_vault_operator_login_token }}"
        ca_path: "{{ operator_vault_ca_cert_path }}"
        client_cert: "{{ operator_vault_client_cert | default(omit, true) }}"
        client_key: "{{ operator_vault_client_key | default(omit, true) }}"
        validate_certs: true
        # Vault answers 404 for a path without any version.
        status_code: [200, 404]
        return_content: true
      register: _platform_haproxy_credentials_read
      changed_when: false
      delegate_to: localhost
      become: false
      no_log: true

    # cas=0 writes only when the path lacks any version, hence a concurrent run cannot replace the minted credentials.
    - name: "0c. Mint the credentials when the Bastion KV holds none"
      when: _platform_haproxy_credentials_read.status == 404
      ansible.builtin.uri:
        url: "{{ operator_vault_url ~ '/v1/secret/data/' ~ haproxy_credential_kv_path }}"
        method: POST
        headers:
          X-Vault-Token: "{{ utils_vault_operator_login_token }}"
        body_format: json
        body:
          options:
            cas: 0
          data:
            keepalived_auth_pass: >-
              {{
                lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits'])
              }}
            stats_password: >-
              {{
                lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_letters', 'digits'])
              }}
        ca_path: "{{ operator_vault_ca_cert_path }}"
        client_cert: "{{ operator_vault_client_cert | default(omit, true) }}"
        client_key: "{{ operator_vault_client_key | default(omit, true) }}"
        validate_certs: true
        status_code: 200
      changed_when: true
      delegate_to: localhost
      become: false
      no_log: true

    - name: "0d. Read the credentials which the Bastion KV holds now"
      ansible.builtin.uri:
        url: "{{ operator_vault_url ~ '/v1/secret/data/' ~ haproxy_credential_kv_path }}"
        method: GET
        headers:
          X-Vault-Token: "{{ utils_vault_operator_login_token }}"
        ca_path: "{{ operator_vault_ca_cert_path }}"
        client_cert: "{{ operator_vault_client_cert | default(omit, true) }}"
        client_key: "{{ operator_vault_client_key | default(omit, true) }}"
        validate_certs: true
        status_code: 200
        return_content: true
      register: _platform_haproxy_credentials
      changed_when: false
      delegate_to: localhost
      become: false
      no_log: true

    - name: "0e. Expose the HAProxy credentials to the role"
      ansible.builtin.set_fact:
        platform_haproxy_keepalived_auth_pass: "{{ _platform_haproxy_credentials.json.data.data.keepalived_auth_pass }}"
        platform_haproxy_stats_password: "{{ _platform_haproxy_credentials.json.data.data.stats_password }}"
      no_log: true

  rescue:
    - name: "Block 0: HAProxy Credentials failed"
      ansible.builtin.fail:
        msg: "{{ ansible_failed_result.msg | default('see task output above') }}"
