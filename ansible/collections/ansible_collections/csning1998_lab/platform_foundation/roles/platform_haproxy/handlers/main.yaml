---
- name: Restart sshd Service
  ansible.builtin.service:
    name: ssh
    state: restarted
    enabled: true

# Defined ahead of Restart Keepalived, since netplan apply reconfigures the links and the restart re-adds a dropped VIP.
- name: Apply Netplan
  ansible.builtin.command:
    cmd: netplan apply
  changed_when: true

- name: Restart Keepalived
  ansible.builtin.systemd:
    name: keepalived
    state: restarted

- name: Restart HAProxy
  ansible.builtin.systemd:
    name: haproxy
    state: restarted
