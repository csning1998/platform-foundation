---
# Executed via ansible-runner or manual tag selection, using ANSIBLE_BECOME_PASS for privilege escalation.
# The plays reach the Bastion KV through the tenant Vault Proxy, which writes the join tokens.
- name: "Play [Setup]: Dynamic Grouping based on node_role"
  hosts: all
  gather_facts: false
  tasks:
    - name: "Create dynamic groups from node_role variable"
      ansible.builtin.group_by:
        key: "{{ node_role | replace('-', '_') }}"
      changed_when: false
      tags:
        - always

# Deploys the local workstation SPIRE Agent via native systemd service.
- name: "Play [SPIRE Agent]: Provision this host's own SPIRE Agent"
  hosts: "{{ 'host_terraform_operator' if 'host_terraform_operator' in groups else [] }}"
  become: true
  tags:
    - spire_agent
  roles:
    - csning1998_lab.platform_foundation.utils_spire_agent

# Deploys the second workstation SPIRE Agent, which attests to the SPIRE Child through the static agent VIP.
- name: "Play [SPIRE Child Agent]: Provision the SPIRE Agent of this host for the SPIRE Child"
  hosts: "{{ 'host_terraform_operator' if 'host_terraform_operator' in groups else [] }}"
  become: true
  tags:
    - spire_agent_child
  roles:
    - role: csning1998_lab.platform_foundation.utils_spire_agent
      vars:
        utils_spire_agent_instance: child
        utils_spire_agent_server_kind: child
        utils_spire_agent_server_address: "{{ spire_child_agent_address }}"
        utils_spire_agent_server_port: "{{ spire_child_agent_port }}"
        utils_spire_agent_child_kubeconfig_kv_path: "{{ spire_child_kubeconfig_kv_path }}"

# Registers per-component Terraform operator workload identities consumed by downstream external data sources.
- name: "Play [Terraform Operator Identity]: Register JWT-SVID fetch wrapper"
  hosts: "{{ 'host_terraform_operator' if 'host_terraform_operator' in groups else [] }}"
  become: true
  tags:
    - terraform_operator_identity
  vars:
    # Normalizes input formats by accepting JSON-encoded strings from automation runners or native YAML lists.
    _utils_terraform_operator_identity_names_raw: "{{ utils_terraform_operator_identity_names | default([]) }}"
    _utils_terraform_operator_identity_names: >-
      {{
        (_utils_terraform_operator_identity_names_raw is string) |
        ternary(
          _utils_terraform_operator_identity_names_raw | from_json,
          _utils_terraform_operator_identity_names_raw
        )
      }}
    # Resolves identity names to absolute SPIFFE ID paths across string or native list inputs.
    _utils_terraform_operator_identity_spiffe_paths_raw: >-
      {{ utils_terraform_operator_identity_spiffe_paths | default({}) }}
    _utils_terraform_operator_identity_spiffe_paths: >-
      {{
        (_utils_terraform_operator_identity_spiffe_paths_raw is string) |
        ternary(
          _utils_terraform_operator_identity_spiffe_paths_raw | from_json,
          _utils_terraform_operator_identity_spiffe_paths_raw
        )
      }}
  tasks:
    - name: "Register workload identity"
      ansible.builtin.include_role:
        name: csning1998_lab.platform_foundation.utils_terraform_operator_identity
      vars:
        utils_terraform_operator_identity_name: "{{ _operator_identity_name }}"
        utils_terraform_operator_identity_spiffe_path: >-
          {{ _utils_terraform_operator_identity_spiffe_paths[_operator_identity_name] }}
        # The platform CLI calls spire-fetch-<identity> on both SPIRE servers.
        # The wrapper name therefore omits the instance suffix.
        utils_terraform_operator_identity_wrapper_name: "spire-fetch-{{ _operator_identity_name }}"
      loop: "{{ _utils_terraform_operator_identity_names }}"
      loop_control:
        loop_var: _operator_identity_name

    - name: "Remove the operator identities which the caller no longer declares"
      ansible.builtin.include_role:
        name: csning1998_lab.platform_foundation.utils_terraform_operator_identity
        tasks_from: reconcile.yaml
      vars:
        utils_terraform_operator_identity_reconcile_identities: "{{ _utils_terraform_operator_identity_spiffe_paths }}"

# Validates the wrappers without privilege escalation to verify drop-in sudoers permissions.
# The Vault login with each JWT-SVID belongs to security-vault-downstream-tenants.
# The login succeeds after the Downstream Vault trusts the SPIRE server of each identity.
- name: "Play [Terraform Operator Verify]: Fetch a JWT-SVID as each operator identity"
  hosts: "{{ 'host_terraform_operator' if 'host_terraform_operator' in groups else [] }}"
  become: false
  gather_facts: false
  tags:
    - terraform_operator_verify
  vars:
    _terraform_operator_verify_names_raw: "{{ utils_terraform_operator_identity_names | default([]) }}"
    _terraform_operator_verify_names: >-
      {{
        (_terraform_operator_verify_names_raw is string) |
        ternary(
          _terraform_operator_verify_names_raw | from_json,
          _terraform_operator_verify_names_raw
        )
      }}
  tasks:
    # Retries JWT retrieval until the agent sync cycle completes new registration entry propagation.
    - name: "Step V1. Fetch a JWT-SVID through the wrapper of each identity"
      ansible.builtin.command:
        cmd: "/usr/local/bin/spire-fetch-{{ item }}"
      loop: "{{ _terraform_operator_verify_names }}"
      register: _terraform_operator_verify_jwt
      until: _terraform_operator_verify_jwt.rc == 0
      retries: 12
      delay: 5
      changed_when: false
      no_log: true

    # The JWT payload is base64url without padding, and the filter takes standard base64 with padding.
    - name: "Step V2. Assert that each JWT-SVID carries the issuer which the Downstream Vault binds"
      vars:
        _payload: "{{ (item.stdout | from_json).jwt.split('.')[1] | replace('-', '+') | replace('_', '/') }}"
        _claims: "{{ (_payload ~ ('=' * ((4 - (_payload | length) % 4) % 4))) | b64decode | from_json }}"
      ansible.builtin.assert:
        that:
          - _claims.iss | default('') == spire_jwt_issuer
        success_msg: "{{ item.item }} fetched a JWT-SVID of issuer {{ spire_jwt_issuer }}"
        fail_msg: "{{ item.item }} fetched a JWT-SVID whose issuer differs from {{ spire_jwt_issuer }}"
      loop: "{{ _terraform_operator_verify_jwt.results }}"
      loop_control:
        label: "{{ item.item }}"
