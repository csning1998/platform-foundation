---
- name: "Play: Provision Common Operation on Base Image"
  hosts: "all"
  become: true
  roles:
    - csning1998_lab.platform_foundation.foundation_common

- name: "Play: Provision Docker Base Image for Keycloak for OIDC"
  hosts: "base-docker-keycloak"
  become: true
  roles:
    - csning1998_lab.platform_foundation.base_docker
    - csning1998_lab.platform_foundation.base_docker_spiffe_helper
    - csning1998_lab.platform_foundation.base_baremetal_vault
    - csning1998_lab.platform_foundation.base_docker_keycloak

- name: "Play: Provision Docker Base Image for Harbor Origin"
  hosts: "base-docker-harbor"
  become: true
  roles:
    - csning1998_lab.platform_foundation.base_docker
    - csning1998_lab.platform_foundation.base_docker_spiffe_helper
    - csning1998_lab.platform_foundation.base_baremetal_vault
    - csning1998_lab.platform_foundation.base_docker_harbor

- name: "Play: Provision Kubernetes (Kubeadm) Base Image"
  hosts: "base-kubernetes-kubeadm"
  become: true
  roles:
    - csning1998_lab.platform_foundation.base_kubernetes_kubeadm
    - csning1998_lab.platform_foundation.base_baremetal_vault

- name: "Play: Provision MicroK8s Base Image"
  hosts: "base-kubernetes-microk8s"
  become: true
  roles:
    - csning1998_lab.platform_foundation.base_kubernetes_microk8s
    - csning1998_lab.platform_foundation.base_baremetal_vault

- name: "Play: Provision Postgres (Singular) Base Image"
  hosts: "base-baremetal-postgres"
  become: true
  roles:
    - csning1998_lab.platform_foundation.base_baremetal_postgres
    - csning1998_lab.platform_foundation.base_baremetal_vault

- name: "Play: Provision Redis (Singular) Base Image"
  hosts: "base-baremetal-redis"
  become: true
  roles:
    - csning1998_lab.platform_foundation.base_baremetal_redis
    - csning1998_lab.platform_foundation.base_baremetal_vault

- name: "Play: Provision MinIO (Singular) Base Image"
  hosts: "base-baremetal-minio"
  become: true
  roles:
    - base_baremetal_minio
    - csning1998_lab.platform_foundation.base_baremetal_vault

- name: "Play: Provision Vault (Singular) Base Image"
  hosts: "base-baremetal-vault"
  become: true
  roles:
    - csning1998_lab.platform_foundation.base_baremetal_vault

- name: "Play: Provision SPIRE Parent (Baremetal) Base Image"
  hosts: "base-baremetal-spire-parent"
  become: true
  roles:
    - csning1998_lab.platform_foundation.base_baremetal_spire

- name: "Play: Provision HAProxy + Keepalived (Baremetal) Base Image"
  hosts: "base-baremetal-haproxy"
  become: true
  roles:
    - csning1998_lab.platform_foundation.base_baremetal_haproxy

- name: "Play: Provision Etcd (Base) Image"
  hosts: "base-baremetal-etcd"
  become: true
  roles:
    - csning1998_lab.platform_foundation.base_baremetal_etcd

- name: "Play: Final Permission Check and Clean up"
  hosts: "all"
  become: true
  roles:
    - csning1998_lab.platform_foundation.foundation_image_finalization
