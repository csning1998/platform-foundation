---
- name: "Play [Setup]: Dynamic Grouping based on node_role"
  hosts: all
  gather_facts: false
  tasks:
    - name: "Create dynamic groups from node_role variable"
      ansible.builtin.group_by:
        key: "{{ node_role | replace('-', '_') }}"
      changed_when: false

- name: "Play [Harbor]: Configure Harbor Origin Cluster"
  hosts: "{{ 'harbor_origin' if 'harbor_origin' in groups else [] }}"
  become: true
  roles:
    - csning1998_lab.platform_foundation.platform_harbor_origin

- name: "Play [Keycloak]: Configure Keycloak Container"
  hosts: "{{ 'keycloak' if 'keycloak' in groups else [] }}"
  become: true
  roles:
    - csning1998_lab.platform_foundation.platform_keycloak

- name: "Play [HAProxy]: Configure HAProxy + Keepalived Frontend"
  hosts: "{{ 'haproxy' if 'haproxy' in groups else [] }}"
  become: true
  roles:
    - csning1998_lab.platform_foundation.platform_haproxy

# Generic Kubernetes Cluster
- name: "Play [Kubernetes]: Provision and Configure MicroK8s Cluster"
  hosts: "{{ 'microk8s' if 'microk8s' in groups else [] }}"
  become: true
  gather_facts: true
  roles:
    - csning1998_lab.platform_foundation.platform_microk8s

- name: "Play [Kubernetes]: Provision and Configure Kubeadm Cluster"
  hosts: "{{ (groups['master'] | default([])) + (groups['worker'] | default([])) }}"
  become: true
  gather_facts: true
  roles:
    - csning1998_lab.platform_foundation.platform_kubeadm
