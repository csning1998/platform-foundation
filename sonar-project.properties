# build-platform.sh and the CI job security:sonarqube read the declarations below.
# The CI job overrides sonar.projectKey, sonar.tests, and sonar.test.inclusions on the command line.
sonar.projectKey=csning1998-lab-platform-engineering-lab-platform-foundation
sonar.projectName=csning1998-lab-platform-engineering-lab-platform-foundation
sonar.sources=tools,terraform,ansible,packer,selinux
sonar.tests=tools
sonar.test.inclusions=**/*_test.go
sonar.exclusions=**/testdata/**,**/.terraform/**,**/*_test.go
sonar.go.coverage.reportPaths=tools/platform/coverage.out
