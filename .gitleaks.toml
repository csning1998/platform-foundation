[extend]
useDefault = true

[[allowlists]]
description = "JDBC connection URLs carry host, port and database name only. Credentials are injected separately through KC_DB_USERNAME and KC_DB_PASSWORD."
targetRules = ["generic-api-key"]
paths = ['''ansible/collections/ansible_collections/csning1998_lab/platform_foundation/roles/platform_keycloak/templates/keycloak\.env\.j2$''']
regexes = ['''jdbc:postgresql://[^\s"']+''']

[[allowlists]]
description = "The Jinja expression writes the unseal keys of the Vault init result to the Bastion Vault at run time. The line carries an expression and holds no key."
targetRules = ["generic-api-key"]
paths = ['''ansible/collections/ansible_collections/csning1998_lab/platform_foundation/roles/provision_vault_downstream/tasks/main\.yaml$''']
regexTarget = "line"
regexes = ['''prod_vault_unseal_keys.*\|\s*to_json''']

[[allowlists]]
description = "The value names the key of the Keycloak database password inside the credential Secret. The line holds no password."
targetRules = ["hashicorp-tf-password"]
paths = ['''terraform/layers/provision-keycloak-oidc/runtime-talos\.tf$''']
regexTarget = "line"
regexes = ['''db_password_key\s*=\s*"keycloak_db_password"''']
